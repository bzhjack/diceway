<div class="flex flex-col gap-2">
  <div class="top-region flex gap-2">
    <p-panel styleClass="region-panel">
      <p-scrollPanel [style]="{height: '100%', width: '270px'}">
        <p-dataView [value]="regions" emptyMessage=" ">
          <ng-template pTemplate="list" let-regions>
            <div class="region-item" [class.p-highlight]="region.id === currentRegion?.id"
                 *ngFor="let region of regions; let first = first" (click)="setCurrentRegion(region)">
              {{ region.region }}
            </div>
          </ng-template>
        </p-dataView>
      </p-scrollPanel>
    </p-panel>
    <p-panel styleClass="region-panel" class="flex-auto relative">
      <div style="position: absolute; inset: 5px 5px 15px 5px;">
        <p-scrollPanel [style]="{height: '100%'}">
               <img id="bol-carte" style="width: 1200px" src="/frontend/assets/bol/carte.jpg" alt="carte"
                    usemap="#image-map"/>
               <map name="image-map">
                 <area id="squidhead" data-maphilight='{"stroke":false,"fillColor":"ff0000","fillOpacity":0.6}' target=""
                       alt="cote de feu" title="cote de feu" href="" coords="561,1412,652,1467" shape="rect">
                 <area target="" alt="" title="" href="" coords="120,1322,261,1410,338,1273,430,1318,431,1274" shape="rect">
                 <area target="" alt="" title="" href="" coords="335,1278,430,1311" shape="rect">
               </map>
             </p-scrollPanel>
      </div>
    </p-panel>
  </div>
  <div class="flex gap-2" style="height: 165px">
    <p-panel styleClass="region-panel" *ngIf="currentRegion && currentRegion.noms.length > 0">
      <p-scrollPanel [style]="{height: '100%'}">
        <div class="flex flex-col gap-2">
          <div class="text-xl">Liste des noms <small>(Sélection possible)</small></div>
          Noms Masculins
          <div class="flex gap-2 flex-wrap">
            <p-tag (click)="selectedName = nom.nom"
                   [styleClass]="selectedName === nom.nom ? 'selected-name' : 'unselected-name'" [value]="nom.nom"
                   *ngFor="let nom of currentRegion.nomsMasculins"></p-tag>
          </div>
          Noms Féminins
          <div class="flex gap-2 flex-wrap">
            <p-tag (click)="selectedName = nom.nom"
                   [styleClass]="selectedName === nom.nom ? 'selected-name' : 'unselected-name'" [value]="nom.nom"
                   *ngFor="let nom of currentRegion.nomsFeminins"></p-tag>
          </div>
        </div>
      </p-scrollPanel>
    </p-panel>

    <p-panel styleClass="region-panel" *ngIf="currentRegion && currentRegion.avantages.length > 0">
      <p-scrollPanel [style]="{height: '100%'}">
        <div class="flex flex-col gap-2">
          Avantages
          <div class="flex gap-2 flex-wrap">
            <ng-container *ngFor="let avantage of currentRegion.avantages">
              <p-tag [value]="avantage.avantage"
                     severity="success"
                     [pTooltip]="tooltipAvantage">
                <div *ngIf="avantage.de_bonus || avantage.attribut" class="tag_icon"
                     [inlineSVG]="avantage.de_bonus ? '/frontend/assets/d6.svg' : '/frontend/assets/attr.svg'"></div>
              </p-tag>
              <ng-template #tooltipAvantage>
                <div class="flex flex-col gap-2">
                  <div *ngFor="let desc of avantageDescription(avantage)" class="flex flex-col">
                    <div style="white-space: nowrap; font-weight: bolder">{{ desc.title }}</div>
                    <div style="width: 250px">{{ desc.description }}</div>
                  </div>
                </div>
              </ng-template>
            </ng-container>

          </div>
          Désavantages
          <div class="flex gap-2 flex-wrap">
            <ng-container *ngFor="let desavantage of currentRegion.desavantages">
              <p-tag [value]="desavantage.desavantage"
                     severity="danger"
                     [pTooltip]="tooltipDesavantage">
                <div *ngIf="desavantage.de_malus || desavantage.attribut" class="tag_icon"
                     [inlineSVG]="desavantage.de_malus ? '/frontend/assets/d6.svg' : '/frontend/assets/attr.svg'"></div>
              </p-tag>
              <ng-template #tooltipDesavantage>
                <div class="flex flex-col gap-2">
                  <div *ngFor="let desc of desavantageDescription(desavantage)" class="flex flex-col">
                    <div style="white-space: nowrap; font-weight: bolder">{{ desc.title }}</div>
                    <div style="width: 250px">{{ desc.description }}</div>
                  </div>
                </div>
              </ng-template>
            </ng-container>

          </div>
        </div>
      </p-scrollPanel>
    </p-panel>

  </div>
</div>
<div class="flex justify-end gap-2">
  <p-button icon="pi pi-times" size="small" label="Quitter" severity="secondary" (click)="quit()"></p-button>
  <p-button icon="pi pi-check" size="small" label="Valider" severity="success" [disabled]="!currentRegion"
            (click)="validate()"></p-button>
</div>
