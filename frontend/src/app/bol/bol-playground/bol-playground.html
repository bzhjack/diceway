<app-topbar title="Barbarian Of Lemuria"></app-topbar>
<div class="bol-playground" #playgroundContainer>
  <ko-stage [config]="configStage">
    <ko-layer>
      @for (config of circleConfigs; track trackConfig($index, config)) {
        <ko-circle
          (dragstart)="handleDragstart($event.event)"
          (dragend)="handleDragend($event.event)"
          [config]="config"
        />
      }
    </ko-layer>
  </ko-stage>
</div>
