<div class="page-container">
  <app-header legend="Les Aventures">
    <button pButton label="Retour" icon="pi pi-arrow-left" severity="secondary" size="small" routerLink="/bol"></button>
  </app-header>
  <div class="flex">
    <div class="flex flex-auto">
      <p-table
        #questTable
        class="w-full"
        [value]="filteredQuestList"
        [scrollable]="true"
        dataKey="id"
        [globalFilterFields]="['origines.nom']"
        scrollHeight="calc(100vh - 170px)">

        <ng-template pTemplate="caption">
          <div class="flex justify-between">
            <div class="flex gap-2 items-center">
              <p-iconField iconPosition="left">
                <p-inputIcon><i class="pi pi-search"></i></p-inputIcon>
                <input
                  pInputText
                  style="padding-left: 2.5rem"
                  class="p-inputtext-sm"
                  type="text"
                  [(ngModel)]="searchTerm"
                  (input)="filtering($event)"
                  placeholder="Votre recherche"/>
              </p-iconField>
               <button pTooltip="Supprimer les filtres" pButton icon="pi pi-filter-slash" severity="info" size="small"
                      (click)="clear(questTable)"></button>
            </div>
            <div class="flex gap-2 items-center">
              <button pButton label="Créer une aventure" icon="pi pi-palette" severity="warning" size="small"
                      (click)="openCreateDialog()"></button>
            </div>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th>Titre</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-quest>
          <tr>
            <td>
              {{quest.titre}}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<p-confirmPopup/>
<!-- Création d'une aventure -->
<p-dialog header="Création d'une aventure" [modal]="true" [(visible)]="showCreate" [style]="{ width: '25rem' }">
  <form [formGroup]="questForm" autocomplete="off" (submit)="createQuest()">
    <div class="flex gap-4 flex-col">
      <div class="flex flex-col gap-1 w-full justify-end relative">
        <label for="titre">Titre</label>
        <input formControlName="titre" pInputText id="titre" class="p-inputtext-sm"/>
        <small *ngIf="onError('titre')" class="dw_error">Minimum 3 caractères</small>
      </div>
      <div class="flex flex-col gap-1 w-full justify-end relative">
        <label for="commentaire">Commentaire</label>
        <textarea formControlName="commentaire" rows="2" cols="30" pInputTextarea id="commentaire" class="p-inputtext-sm"></textarea>
        <small *ngIf="onError('commentaire')" class="dw_error">Minimum 3 caractères</small>
      </div>
    </div>
    <div class="flex pt-4 justify-end gap-2">
      <p-button label="Retour" icon="pi pi-times" severity="secondary" size="small"
                (click)="showCreate= false"></p-button>
      <p-button label="Créer" icon="pi pi-check" size="small" severity="success" (click)="createQuest()"
                [disabled]="questForm.invalid"></p-button>
    </div>
  </form>
</p-dialog>
