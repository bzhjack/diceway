<p-card class="creature_card" [style]="{border: '1px solid #424b57'}">
  @if ((hero$ | async) && hero()) {
    <div class="flex gap-2">
      <div class="heros_card__img">
        <img style="width:100%"
             [src]="hero()?.origines?.avatar !== null ? hero()?.origines?.avatar : '/frontend/assets/bol/empty-avatar.jpg'"
             alt="avatar">
      </div>
      <div class="flex flex-col gap-2" style="width: 150px">
        <div class="heros_card__name" pTooltip="{{ hero()?.origines?.joueur }}">{{ hero()?.origines?.nom }}</div>
        <div class="flex gap-2 items-center">
          <p-tag severity="danger" pTooltip="Vitalité">
          <div class="flex items-center gap-2 px-1">
            <div style="width: 15px; height:15px;"><i class="pi pi-heart-fill" style="color: red; padding-top: 2px"></i></div>
            <span style="color: white">{{hero()?.currentQuest?.vitalite ?? hero()?.ressources?.vitalite }}</span>
          </div>
        </p-tag>
          <p-tag severity="warning" pTooltip="Heroisme">
            <div class="flex items-center gap-2 px-1">
              <div class="tag_icon warn" inlineSVG="/frontend/assets/flame.svg"></div>
              <span style="color: white">{{hero()?.currentQuest?.heroisme ?? hero()?.ressources?.heroisme }}</span>
            </div>
          </p-tag>
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <app-btn pRipple icon="d6" (click)="openAction()"></app-btn>
        <app-btn pRipple icon="user-edit" (click)="fichePerso()"></app-btn>
      </div>
    </div>

  } @else {
    <div class="flex gap-2" style="height:54px">
      <p-skeleton size="50px"/>
      <div class="flex flex-col gap-1">
        <p-skeleton width="150px" height="17px"/>
        <p-skeleton width="50px" height="20px"/>
      </div>
      <div class="flex flex-col gap-2">
        <p-skeleton size="21px"/>
        <p-skeleton size="21px"/>
      </div>
    </div>
  }
</p-card>
