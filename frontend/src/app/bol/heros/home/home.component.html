<div>
  <app-header legend="Héros">
    <button pButton label="Création" icon="pi pi-pencil" severity="warning" size="small" (click)="openCreateDialog()"></button>
    <button pButton label="Retour" icon="pi pi-arrow-left" severity="secondary" size="small" routerLink="/bol"></button>
  </app-header>
</div>
<div class="bol-container flex flex-col p-4">
  <p-card header="Personnages Joueurs">
    <p class="flex flex-col gap-2">
      <p-table [value]="heroes"
               [tableStyle]="{ 'min-width': '50rem' }"
               [scrollable]="true"
               scrollHeight="300px">
        <ng-template pTemplate="header">
          <tr>
            <th></th>
            <th>Joueur</th>
            <th>Héros</th>
            <th style="width: 100px"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-heros>
          <tr>
            <td style="padding: 0!important;">
              <div class="hero-avatar"><img style="width:100%"
                                            [src]="heros.origines.avatar !== null ? heros.origines.avatar : '/frontend/assets/bol/empty-avatar.jpg'"
                                            alt="avatar">
              </div>
            </td>
            <td>{{ heros.joueur }}</td>
            <td>{{ heros.origines.nom }}</td>
            <td class="flex gap-2 justify-end">
              <button [routerLink]="['create', heros.id]"
                      severity="secondary" type="button" size="small" pButton pRipple icon="pi pi-pencil"></button>
              <button (click)="deleteHero(heros, $event)"
                      severity="danger" type="button" size="small" pButton pRipple icon="pi pi-trash">
              </button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p>
    <ng-template pTemplate="footer">
      <div class="flex justify-end">
        <p-button label="Créer" icon="pi pi-plus" size="small" severity="primary"
                  (click)="openCreateDialog()"></p-button>
      </div>
    </ng-template>
  </p-card>
</div>


<!-- Création de personnage -->
<p-dialog header="Création de personnage" [modal]="true" [(visible)]="showCreate" [style]="{ width: '25rem' }">
  <form [formGroup]="herosForm" autocomplete="off" (submit)="createHero()">
    <span class="p-text-secondary block mb-5">Commençez par renseigner le nom du joueur.</span>
    <div class="flex gap-2 flex-col">
      <div class="flex flex-col gap-1 w-full justify-end relative">
        <label for="joueur">Nom du joueur</label>
        <input formControlName="joueur" pInputText id="joueur" class="p-inputtext-sm"/>
        <small *ngIf="onError('joueur')" class="dw_error">Minimum 3 caractères</small>
      </div>
      <div class="flex flex-col gap-1 w-full justify-end relative">
        <label for="joueur">Nom du héros</label>
        <input formControlName="nom" pInputText id="nom" class="p-inputtext-sm"/>
        <small *ngIf="onError('nom')" class="dw_error">Minimum 3 caractères</small>
      </div>
    </div>
    <div class="flex pt-4 justify-end gap-2">
      <p-button label="Retour" icon="pi pi-times" severity="secondary" size="small"
                (click)="showCreate= false"></p-button>
      <p-button label="Créer" icon="pi pi-check" size="small" severity="success" (click)="createHero()"
                [disabled]="herosForm.invalid"></p-button>
    </div>
  </form>
</p-dialog>

<p-confirmPopup/>
