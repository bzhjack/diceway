<div class="page-container">
  <app-header legend="Création d'un héros">
    <button pButton label="Retour"
            icon="pi pi-times"
            severity="secondary"
            size="small"
            routerLink="/bol/heros"></button>
    <button pButton (click)="submit()" [disabled]="herosForm.invalid" label="Enregistrer" icon="pi pi-save"
            size="small" severity="warning"></button>
    <button pButton [disabled]="herosForm.invalid || warnCount() > 0" label="Activer le personnage" (click)="herosActivation()" icon="pi pi-check"
            size="small" severity="success"></button>

  </app-header>
  <div class="flex flex-col p-4">
    <!----------------------->
    <!--- Body de la page --->
    <!----------------------->
    <p-scrollPanel styleClass="flex-auto" [style]="{height: 'calc(100vh - 135px)'}">
      <form (ngSubmit)="submit()" [formGroup]="herosForm" autocomplete="off">
        <div class="flex gap-1">
          <div>
            <bol-heros-origines [heroId]="heroId()" formControlName="origines"></bol-heros-origines>
            <div class="flex gap-1">
              <bol-heros-ressources formControlName="ressources"></bol-heros-ressources>
              <bol-heros-attributs formControlName="attributs"></bol-heros-attributs>
              <bol-heros-combat formControlName="combat"></bol-heros-combat>
            </div>
            <div class="flex gap-2">
              <bol-heros-armes formControlName="armes"></bol-heros-armes>
              <bol-heros-armures formControlName="armures"></bol-heros-armures>
            </div>
          </div>

          <div class="flex flex-col">
            <bol-heros-traits formControlName="traits"></bol-heros-traits>
            <bol-heros-carrieres formControlName="carrieres" (desavantageCreated)="addCarriereDesavantage($event)"></bol-heros-carrieres>
            <p-fieldset legend="Modificateurs après activation" class="modifiers" *ngIf="modifiers().length">
              <p-table [value]="modifiers()" styleClass="p-datatable-striped">
                <ng-template pTemplate="header">
                  <tr>
                    <th>Attribut</th>
                    <th>Modificateur</th>
                  </tr>
                </ng-template>
                <ng-template pTemplate="body" let-modifier>
                  <tr>
                    <td class="whitespace-nowrap text-gray-300 capitalize">{{ modifier.attr }}</td>
                    <td>{{ modifier.value }}</td>
                  </tr>
                </ng-template>
              </p-table>
            </p-fieldset>
          </div>
        </div>

      </form>
    </p-scrollPanel>
  </div>
</div>


<!--------------------------------->
<!--- Container de confirmation --->
<!--------------------------------->
<p-confirmPopup/>
