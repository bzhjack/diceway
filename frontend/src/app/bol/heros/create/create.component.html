<div class="flex flex-col h-full p-4">
  <!------------------------->
  <!--- Header de la page --->
  <!------------------------->
  <div class="flex justify-between items-center">
    <div class="text-3xl">Création d'un héros</div>
  </div>

  <!----------------------->
  <!--- Body de la page --->
  <!----------------------->
  <p-scrollPanel styleClass="flex-auto" [style]="{height: 'calc(100vh - 155px)'}">
    <form (ngSubmit)="submit()" [formGroup]="herosForm" autocomplete="off">
      <div class="flex gap-4">
        <div class="flex flex-col gap-2">
          <!-------------->
          <!--- player --->
          <!-------------->
          <div class="flex gap-2 justify-between">
            <div class="flex flex-col gap-1 w-fit justify-end">
              <label for="joueur">Nom du joueur</label>
              <input formControlName="joueur" pInputText id="joueur" class="p-inputtext-sm" />
            </div>
          </div>
          <!----------------------------->
          <!--- attributs , aptitudes --->
          <!----------------------------->
          <div class="flex gap-2">
            <!-------------->
            <!-- Origines -->
            <!-------------->
            <bol-origines [heroId]="heroId()" formControlName="origines"></bol-origines>
            <!--------------->
            <!-- Attributs -->
            <!--------------->
            <bol-attributs formControlName="attributs"></bol-attributs>
            <!--------------->
            <!-- Aptitudes -->
            <!--------------->
            <bol-combat formControlName="combat"></bol-combat>
            <!----------------------->
            <!--- Champs calculés --->
            <!----------------------->
            <div class="dw-panel" style="margin-top: 13px;margin-bottom: 2px;padding-top: 12px;">
              <div class="flex gap-2 relative p-3">
                <div class="flex flex-col gap-1">
                  <label>Vitalité</label>
                  <input style="width: 50px; text-align: center" formControlName="vitalite" pInputText
                    class="p-inputtext-sm" variant="filled" tabindex="-1" />
                </div>
                <div class="flex flex-col gap-1">
                  <label>Heroisme</label>
                  <input style="width: 50px; text-align: center" formControlName="heroisme" pInputText
                    class="p-inputtext-sm" variant="filled" tabindex="-1" />
                </div>
                <div style="position: absolute; inset: 0;"></div>
              </div>
            </div>
          </div>
          <!------------------------------>
          <!--- Carrières et avantages --->
          <!------------------------------>
          <div class="flex gap-2">
            <div class="flex flex-col flex-auto gap-2">
              <!--------------------------------->
              <!--- avantages et désavantages --->
              <!--------------------------------->
              <p-fieldset class="w-full">
                <ng-template pTemplate="header">
                  <div class="flex items-center gap-2">
                    <div class="cursor-pointer" (click)="traitInfos.toggle($event)">
                    </div>
                    <div>Avantages & Désavantages</div>
                  </div>
                  <p-overlayPanel #traitInfos>
                    <div class="flex flex-col gap-2">
                      <bol-message type="traits"></bol-message>
                    </div>
                  </p-overlayPanel>
                </ng-template>
                <div class="flex gap-2">
                  <div class="flex flex-col gap-2">
                    <app-trait-row *ngFor="let lavg of avantages" [avantage]="lavg"></app-trait-row>
                  </div>
                  <div class="flex flex-col gap-2">
                    <app-trait-row *ngFor="let ldes of desavantages" [desavantage]="ldes"></app-trait-row>
                  </div>
                </div>

                <div class="flex justify-end gap-2">
                  <p-button (click)="openTraits()" label="Gérer les avantages" size="small" [link]="true" />
                </div>


              </p-fieldset>
              <!------------------------------------->
              <!--- Fin avantages et désavantages --->
              <!------------------------------------->
              <bol-carrieres [heroId]="heroId()" formControlName="carrieres"></bol-carrieres>
            </div>
            <!------------------------>
            <!--- Armes et Armures --->
            <!------------------------>
            <div class="flex flex-col flex-auto gap-2 ">
              <bol-armures [heroId]="heroId()" formControlName="armures"></bol-armures>
              <bol-armes [heroId]="heroId()" formControlName="armes"></bol-armes>
            </div>
          </div>
        </div>
      </div>
    </form>
  </p-scrollPanel>

  <!------------------------->
  <!--- Footer de la page --->
  <!------------------------->
  <div class="flex pt-4 justify-end">
    <!--- Bouton Quitter et Sauvegarde --->
    <div class="flex gap-2">
      <button pButton label="Retour" icon="pi pi-times" severity="secondary" size="small" routerLink="/bol"></button>
      <button pButton (click)="submit()" [disabled]="herosForm.invalid" label="Enregistrer" icon="pi pi-check"
        size="small" severity="success"></button>
    </div>
  </div>
</div>

<!--------------------------------->
<!--- Container de confirmation --->
<!--------------------------------->
<p-confirmPopup />
