<div class="flex flex-col gap-2 h-full">
  <p-fieldset legend="Liste des carrières" class="w-full h-full" styleClass="h-full relative">
    <div class="flex gap-2" style="position: absolute; inset:15px;">
      <p-scrollPanel class="flex-auto" [style]="{display: 'block', height: '100%'}">
        <div class="flex gap-2 flex-wrap">
          <ng-container *ngFor="let carriere of carrieres">
            <div class="carriere-item flex gap-2 pb-2"
                 [class.disabled]="(carriereIds.length === 4 && !carriereIds.includes(carriere.id))">
              <p-checkbox name="car"
                          (onChange)="checkSelection()"
                          [disabled]="(carriereIds.length === 4 && !carriereIds.includes(carriere.id))"
                          [(ngModel)]="selectedCarrieres"
                          [value]="carriere"></p-checkbox>
              <div class="flex flex-col">
                <div class="flex gap-2">
                  {{carriere.carriere}}
                  <div *ngIf="carriere.description" class="cursor-pointer" (click)="carPanel.toggle($event)">
                    <i  class="pi pi-info-circle"></i>
                  </div>
                </div>
                <div class="carriere-detail" *ngIf="carriere.detail">{{carriere.detail}}</div>
              </div>

            </div>
            <p-overlayPanel #carPanel>
              <div class="dw-panel" style="background: #424B57">
                <div class="flex flex-col">
                  <div style="font-size: 12px; white-space: nowrap; font-weight: bolder">Description</div>
                  <div style="font-size: 12px">{{ carriere.description }}</div>
                </div>
              </div>
            </p-overlayPanel>
          </ng-container>

        </div>
      </p-scrollPanel>
    </div>
  </p-fieldset>
  <div class="flex justify-end gap-2">
    <button pButton icon="pi pi-times" size="small" label="Quitter" severity="secondary"
            (click)="quit()"></button>
    <button pButton icon="pi pi-check" size="small" label="Valider" severity="success"
            (click)="validate()"
            [disabled]="carriereIds.length === 0"></button>
  </div>
</div>
