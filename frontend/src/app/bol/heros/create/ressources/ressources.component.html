<p-fieldset class="w-full" [formGroup]="ressourcesForm">
  <!-- Header Carrières -->
  <ng-template pTemplate="header">
    <div>Ressources</div>
  </ng-template>

  <div class="flex gap-2 relative p-3">
    <div class="flex flex-col gap-1">
      <label>Vitalité</label>
      <input style="width: 50px; text-align: center" formControlName="vitalite" pInputText
             class="p-inputtext-sm" variant="filled" tabindex="-1" />
    </div>
    <div class="flex flex-col gap-1">
      <label>Heroisme</label>
      <input style="width: 50px; text-align: center" formControlName="heroisme" pInputText
             class="p-inputtext-sm" variant="filled" tabindex="-1" />
    </div>
    <div style="position: absolute; inset: 0;"></div>
  </div>

</p-fieldset>
