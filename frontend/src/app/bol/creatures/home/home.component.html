<div>
  <app-header legend="Bestiaire de Lémurie">
    <!-- Champ de recherche -->
    <div class="flex items-center gap-2">
      <!-- Contrôle de type -->
      <p-dropdown [options]="typeOptions" [(ngModel)]="type" placeholder="Sélectionner un type" (ngModelChange)="filterCreatures()"></p-dropdown>
      <input type="text" style="height: 30px" class="p-inputtext-sm" pInputText placeholder="Rechercher par nom" [(ngModel)]="searchTerm" (input)="filterCreatures()" />
    </div>
    <button pButton label="Création" icon="pi pi-pencil" severity="warning" size="small" (click)="createCreature()"></button>
    <button pButton label="Retour" icon="pi pi-arrow-left" severity="secondary" size="small" routerLink="/bol"></button>

  </app-header>

  <p-table
    [value]="bestiary"
    [scrollable]="true"
    scrollHeight="calc(100vh - 120px)">
    <ng-template pTemplate="header">
      <tr>
        <th></th>
        <th>Nom</th>
        <th>Taille</th>

      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-beast>
      <tr>
        <td style="width: 110px">
          <div class="beast_row__img">
            <img *ngIf="!beast.user_id" src="/frontend/assets/bol/bestiary/{{beast.id}}.png" alt=""/>
            <img *ngIf="beast.user_id"
                 style="width:100%"
                 [src]="beast.avatar !== null ? beast.avatar : '/frontend/assets/bol/empty-avatar.jpg'"
                 alt="avatar">
          </div>
        </td>
        <td>{{ beast.nom }}</td>
        <td>{{ beast.taille.taille }}</td>
      </tr>
    </ng-template>
  </p-table>
   <!--bol-creature-card              [creature]="bestiary[0]"></bol-creature-card-->
</div>


<p-confirmPopup/>
