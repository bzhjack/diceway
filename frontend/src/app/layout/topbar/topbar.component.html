<div class="dw-topbar items-center justify-between">
    <div class="dw-topbar__logo">
        <div class="dw_banner" [inlineSVG]="'/frontend/assets/banner.svg'"></div>
    </div>
  <div *ngIf="userObs | async as user" class="flex gap-4 cursor-pointer" (click)="op.toggle($event)">
    <div class="flex flex-col">
      <div>{{user.name}}</div>
      <div><small>{{user.email}}</small></div>
    </div>
    @if (user.avatar) {
      <p-avatar [image]="user.avatar" styleClass="mr-2" size="large" shape="circle"></p-avatar>
    } @else {
      <p-avatar icon="pi pi-user" styleClass="mr-2" size="large" shape="circle"></p-avatar>
    }
  </div>
</div>

<p-overlayPanel #op>
  <a (click)="logout()" class="underline cursor-pointer">Se déconnecter</a>
</p-overlayPanel>
