<div class="flex flex-col h-screen items-center justify-center gap-5">
  <div class="dw_banner" [inlineSVG]="'/assets/banner.svg'"></div>
  <p-card class="relative" header="S'identifier">
    <form [formGroup]="loginForm" class="flex flex-col gap-4">
      <div>
        <p-inputGroup class="relative">
          <p-inputGroupAddon>
            <i class="pi pi-user"></i>
          </p-inputGroupAddon>
          <input formControlName="email" pInputText placeholder="Adresse mail" autocomplete="username"/>
        </p-inputGroup>
        @if (onError('email')) {
          <p-message severity="error" size="small" variant="simple">Adresse mail non valide</p-message>
        }
      </div>
      <div>
        <p-inputGroup class="relative">
          <p-inputGroupAddon>
            <i class="pi pi-lock"></i>
          </p-inputGroupAddon>
          <input formControlName="password" type="password" pInputText placeholder="Mot de passe"
                 autocomplete="current-password"/>
        </p-inputGroup>
        @if (onError('password')) {
          <p-message severity="error" size="small" variant="simple">Minimum 8 caractères</p-message>
        }
      </div>

      @if (messages.length > 0) {
        @for (message of messages; track message) {
          <p-message severity="error" variant="outlined" size="small">{{ message }}</p-message>
        }
      }
      <div class="flex justify-between">
        <p-button [routerLink]="'/forgotten'" label="Mot de passe oublié" size="small" [text]="true"
                  severity="secondary" [disabled]="pending"></p-button>
        <p-button label="Connexion" size="small" (click)="login()" [disabled]="pending"
                  type="submit"></p-button>
      </div>
      @if (!pending) {
        <div class="flex flex-col items-center pt-4 text-s">
          <div>Vous n'avez pas de compte ?</div>
          <p-button [routerLink]="'/register'" label="Inscrivez-vous" size="small" [text]="true"
                    severity="secondary"></p-button>
        </div>
      }
    </form>
    @if (!pending) {
      <div class="flex justify-center">
        <a class="p-button p-button-secondary" size="small" (click)="loginWithGoogle()" style="text-decoration: none;">
          <div class="flex login__google items-center">
            <img src="/assets/socialite/google.svg">
            <div>Continuer avec Google</div>
          </div>
        </a>
      </div>
    }

    @if (pending) {
      <p-progressBar class="dw_progress" mode="indeterminate"
                     [style]="{ height: '6px' }"></p-progressBar>
    }
  </p-card>
</div>
