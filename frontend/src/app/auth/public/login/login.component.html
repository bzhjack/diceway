<div class="flex flex-col h-full items-center w-full justify-center gap-5">
    <div class="banner" [inlineSVG]="'/frontend/assets/banner.svg'"></div>
    <p-card header="S'identifier">
        <div class="flex flex-col gap-4">
            <p-inputGroup>
                <p-inputGroupAddon>
                    <i class="pi pi-user"></i>
                </p-inputGroupAddon>
                <input pInputText placeholder="Adresse mail" />
            </p-inputGroup>
    
            <p-inputGroup>
                <p-inputGroupAddon>
                    <i class="pi pi-lock"></i>
                </p-inputGroupAddon>
                <input pInputText placeholder="Mot de passe" />
            </p-inputGroup>
            <div class="flex justify-between">
                <p-button [routerLink]="'/forgotten'" label="Mot de passe oublié" size="small" [text]="true" severity="secondary"></p-button>
                <p-button label="Connexion" size="small"></p-button>
            </div>
            <div class="flex flex-col items-center pt-4 text-s">
                <div>Vous n'avez pas de compte ?</div>
                <p-button [routerLink]="'/register'" label="Créér votre compte" size="small" [text]="true" severity="secondary"></p-button>
            </div>
        </div>
    </p-card>
</div>
