<div class="flex flex-col h-full items-center w-full justify-center gap-5">
    <div class="dw_banner" [inlineSVG]="'/frontend/assets/banner.svg'"></div>
        <p-card header="Finaliser votre inscription">
            <div class="flex flex-col">
                <h3 class="m-0">Un mail vient de vous être envoyé</h3>
                <h4 class="mb-1 mt-0">
                  Pour finaliser votre inscription, rendez-vous dans votre boîte mail pour activer votre compte.
                </h4>
                <div class="dw_container mb-4 mt-4">
                  Pas d'e-mail reçu dans votre boîte de réception ou vos spam ?
                  <p-button [routerLink]="'/resend'" label="Renvoyer l'e-mail" size="small" [text]="true" severity="primary"></p-button>
                </div>
              </div>
              <div class="flex justify-end gap-4">
                <p-button [routerLink]="'/'" label="Continuer" size="small" severity="secondary"></p-button>
              </div>
        </p-card>
</div>
