<div class="flex flex-col h-screen items-center w-full justify-center gap-5">
    <div class="dw_banner" [inlineSVG]="'/frontend/assets/banner.svg'"></div>
    <p-card *ngIf="!success" header="Bienvenue sur Diceway">
        <div class="flex flex-col gap-4">
            <div class="text-sm">Votre compte est désormais actif et vous pouvez maintenant vous connecter</div>
            <div class="flex justify-end gap-4">
                <p-button [routerLink]="'/login'" label="Continuer" size="small"></p-button>
            </div>
        </div>
    </p-card>
  <p-card *ngIf="success" header="Mot de passe modifié.">
    <div class="flex flex-col gap-4">
      <div class="text-sm">Votre mot de passe a été modifié avec succès, vous pouvez maintenant vous connecter</div>
      <div class="flex justify-end gap-4">
        <p-button [routerLink]="'/login'" label="Continuer" size="small"></p-button>
      </div>
    </div>
  </p-card>
</div>
