<div class="flex flex-col h-screen items-center gap-1 pt-10">
  <img src="assets/dw1.jpg" alt="" style="width: 400px; height: 302px;">
  <div class="text-xl" >Nouveau mot de passe</div>
    <form [formGroup]="resetForm" class="flex flex-col gap-2 w-1/4">
      <div class="relative flex flex-col">
        <input class="p-inputtext-sm" type="password" formControlName="password" pInputText placeholder="Mot de passe*"
               autocomplete="new-password"/>
        @if (onError('password')) {
          <p-message severity="error" size="small" variant="simple">Minimum 8 caractères</p-message>
        }
      </div>
      <div class="relative flex flex-col">
        <input class="p-inputtext-sm" type="password" formControlName="password_confirmation" pInputText
               placeholder="Confirmer le mot de passe*" autocomplete="new-password"/>
        @if (onError('password_confirmation') || resetForm.hasError('matchingError')) {
          <p-message severity="error" size="small" variant="simple">Ne corresponds pas</p-message>
        }
      </div>
      <div>
        @for (message of messages; track message) {
          <p-message severity="error" [closable]="false">{{ message }}</p-message>
        }
      </div>
      <div class="flex justify-end gap-2">
        <p-button [routerLink]="'/'" label="retour" size="small" severity="secondary"
                  [disabled]="pending"></p-button>
        <p-button label="Valider" size="small" [disabled]="resetForm.invalid || pending" (click)="reset()"
                  type="submit"></p-button>
      </div>
      @if (pending) {
        <p-progressBar mode="indeterminate" [style]="{ height: '6px' }"></p-progressBar>
      }
    </form>

</div>
