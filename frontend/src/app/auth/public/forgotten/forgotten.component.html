<div class="flex flex-col h-screen items-center w-full justify-center gap-5">
  <div class="dw_banner" [inlineSVG]="'/frontend/assets/banner.svg'"></div>
  <p-card header="Mot de passe oublié ?" class="relative w-full md:w-1/2 lg:w-1/3" [class.forbidden]="forbidden">
    <form [formGroup]="forgotForm" class="flex flex-col gap-4">
      <div class="text-sm">
        Renseigner votre adresse mail ci dessous et nous vous everrons une lien pour pouvoir modifier votre mot de
        passe.
      </div>
      <div class="relative flex flex-col">
        <p-inputGroup>
          <p-inputGroupAddon>
            <i class="pi pi-user"></i>
          </p-inputGroupAddon>
          <input pInputText formControlName="email" placeholder="Adresse mail" autocomplete="username"/>
        </p-inputGroup>
        <small *ngIf="onError('email')" class="dw_error">Adresse mail non valide</small>
      </div>
      <div *ngIf="messages.length > 0">
        <p-messages [(value)]="messages" [enableService]="false" [closable]="false"></p-messages>
      </div>
      <div class="flex justify-between">
        <p-button [routerLink]="'/'" label="retour" size="small" [outlined]="true" severity="secondary"
                  [disabled]="pending"></p-button>
        <p-button label="Envoyer" size="small" [disabled]="forgotForm.invalid || pending" (click)="send()"
                  type="submit"></p-button>
      </div>
    </form>
    <p-progressBar *ngIf="pending" class="dw_progress" mode="indeterminate" [style]="{ height: '6px' }"></p-progressBar>
  </p-card>
</div>
