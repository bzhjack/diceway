<div class="flex flex-col gap-2 p-2">
  <div class="header-file w-full">
    @if (imageChangedEvent) {
      <div class="flex justify-between w-full">
        <div class="gap-2">
          <p-button (click)="file.click()" icon="pi pi-upload" size="small" label="Importer une image"></p-button>
        </div>
        <div class="flex gap-1">
          <p-button icon="pi pi-search-plus" size="small" (click)="zoomIn()"></p-button>
          <p-button icon="pi pi-search-minus" size="small" (click)="zoomOut()"></p-button>
          <p-button icon="pi pi-sync" size="small" (click)="resetImage()"></p-button>
        </div>
      </div>
    }
    <input id="importFile" style="display: none" type="file" #file (change)="fileChangeEvent($event)"/>
  </div>
  <div>
    @if (imageChangedEvent) {
      <div class="body-file">
        <div style="width: 500px; border: 1px solid black; overflow: hidden">
          <image-cropper
            [transform]="transform"
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="true"
            [aspectRatio]="1 / 1"
            [backgroundColor]="'#424242'"
            format="png"
            output="base64"
            [resizeToWidth]="256"
            [cropperMinWidth]="128"
            (loadImageFailed)="loadImageFailed()"
            (imageCropped)="imageCropped($event)"></image-cropper>
        </div>
        <div style="padding-left: 20px">
          <img [src]="croppedImage" [style.border]="croppedImage ? '1px solid white' : 'none'"/>
        </div>
      </div>
    } @else {
      <div class="picture-no-image flex flex-col h-full items-center justify-center"
           dwDragDropFile
           (filesDropped)="dropFileEvent($event)">
        <i class="pi pi-upload" style="font-size: 3rem"></i>
        <div class="flex items-center pt-4">
          Déposer l'image ici, ou
          <p-button [style]="{padding: '5px'}" label="sélectionner le fichier" [link]="true" (click)="file.click()"/>
        </div>
      </div>
    }
  </div>

  <div class="flex justify-end gap-2 pt-3">
    <p-button icon="pi pi-times" size="small" label="Quitter" severity="secondary" (click)="quit()"></p-button>
    <p-button [disabled]="!imageChangedEvent" icon="pi pi-check" size="small" label="Valider" severity="success"
              (click)="validate()"></p-button>
  </div>
</div>
