<div class="cc-card" [class]="'cc-card--' + entry().kind">
  <button
    type="button"
    class="cc-open cc-thumb"
    [class]="'cc-thumb--' + entry().kind"
    [attr.aria-label]="'Voir le statbloc de ' + entry().nom"
    (click)="openStatblock()"
  >
    <img [src]="entry().avatar" [alt]="entry().nom" class="cc-avatar" />
  </button>

  <div class="cc-info">
    <p class="cc-name">
      <mat-icon [class]="'cc-kind-icon cc-kind-icon--' + entry().kind" [attr.aria-label]="rankLabel()">{{ kindIcon() }}</mat-icon>
      {{ entry().nom }}
    </p>
    <p class="cc-gauge"><span class="cc-rank">{{ rankLabel() }}</span> · ❤ {{ entry().vitalite }}</p>
  </div>

  @if (selection.isStackable(entry().kind)) {
    <div class="cc-qty">
      <button type="button" (click)="selection.decQty(combatant().catalogId)" aria-label="Retirer un exemplaire">−</button>
      <span>{{ combatant().qty }}</span>
      <button type="button" (click)="selection.incQty(combatant().catalogId)" aria-label="Ajouter un exemplaire">+</button>
    </div>
  }

  <button
    mat-icon-button
    type="button"
    class="cc-remove"
    aria-label="Retirer ce combattant"
    (click)="selection.remove(combatant().catalogId)"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
