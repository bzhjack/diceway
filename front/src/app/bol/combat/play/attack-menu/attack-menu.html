<button
  type="button"
  class="am-trigger"
  [attr.aria-label]="'Attaquer avec ' + attackerName()"
  #trigger="matMenuTrigger"
  [matMenuTriggerFor]="menu"
  (click)="$event.stopPropagation()"
  (menuOpened)="reset()"
>
  <mat-icon svgIcon="sword" />
</button>

<mat-menu #menu="matMenu" class="am-panel">
  <div class="am-content" (click)="$event.stopPropagation()">
    <span class="am-eyebrow">Arme</span>
    <div class="am-chips">
      @for (a of displayArmes(); track a.id) {
        <button
          type="button"
          class="am-chip"
          [class.am-chip--selected]="effectiveArme()?.id === a.id"
          (click)="selectArme(a.id)"
        >
          {{ a.arme?.arme }}
          @if (a.arme?.degats) {
            <span class="am-chip-mod">{{ a.arme?.degats }}</span>
          }
        </button>
      }
    </div>

    <button type="button" class="am-confirm" (click)="confirm(); trigger.closeMenu()">
      <mat-icon>my_location</mat-icon>
      Cibler
    </button>
  </div>
</mat-menu>
