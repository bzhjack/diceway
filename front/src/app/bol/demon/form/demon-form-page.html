<section class="dw-page">
  <div class="mx-auto flex max-w-6xl flex-col gap-4">
    <mat-card appearance="outlined">
      <mat-card-content>
        <form class="dw-creation-form flex flex-col gap-6" (submit)="onFormSubmit($event)">
          <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
            <div class="space-y-3">
              <div class="flex items-center gap-3">
                <div class="dfp-icon">
                  <mat-icon>bolt</mat-icon>
                </div>
                <div class="space-y-1">
                  <p class="dfp-eyebrow">
                    {{ pageEyebrow() }}
                  </p>
                  <h1 class="dfp-title">
                    {{ pageTitle() }}
                  </h1>
                </div>
              </div>
            </div>

            <div class="flex flex-col gap-3 sm:flex-row md:justify-end">
              <button mat-stroked-button type="button" [disabled]="pending()" (click)="goBack()">
                <mat-icon>arrow_back</mat-icon>
                {{ returnUrl() === '/library/demons' ? 'Retour à la bibliothèque' : 'Retour' }}
              </button>

              <button
                mat-flat-button
                type="submit"
                [disabled]="pending() || loading() || demonForm().invalid()"
              >
                <mat-icon>save</mat-icon> {{ submitLabel() }}
                @if (formDirty()) {
                  <span class="dfp-dirty-dot" aria-label="Modifications non enregistrées"></span>
                }
              </button>
            </div>
          </div>

          <div class="grid gap-4">
            @if (loading()) {
              <div class="dfp-loading-box">
                <p class="dfp-section-eyebrow">
                  Chargement
                </p>
                <p class="dfp-loading-detail">
                  Récupération du démon à modifier.
                </p>
              </div>
            }

            <div class="grid gap-4 xl:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] xl:items-stretch">
              <div class="dfp-section-card xl:h-full">
                <bol-demon-general
                  [form]="demonForm"
                  [categories]="categories()"
                  [compareById]="compareById"
                  [avatarPreview]="avatarPreview()"
                  [showValidationHint]="showGeneralHint()"
                  (avatarClick)="pickAvatar()"
                />
              </div>

              <div class="dfp-section-card xl:h-full">
                <bol-demon-pouvoirs
                  [pouvoirs]="selectedPouvoirEntries()"
                  [pouvoirsDisponibles]="filteredPouvoirs()"
                  (added)="addPouvoirEntry($event)"
                  (removed)="removePouvoir($event)"
                />
              </div>
            </div>

            <div class="dfp-section-card">
              <bol-stats-grid-field [form]="statsForm" [groups]="demonStatGroups" />
            </div>

            @if (errorMessage()) {
              <div class="dfp-error-box">
                {{ errorMessage() }}
              </div>
            }
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</section>
