<section class="dw-page">
  <div class="mx-auto flex max-w-6xl flex-col gap-4">
    <mat-card appearance="outlined">
      <mat-card-content>
        <form class="dw-creation-form" (submit)="onFormSubmit($event)">
          <dw-form-header icon="gi-demon" [eyebrow]="pageEyebrow()" [title]="pageTitle()">
            <button mat-stroked-button type="button" [disabled]="pending()" (click)="goBack()">
              <mat-icon svgIcon="gi-return" />
              {{ returnUrl() === '/library/demons' ? 'Retour à la bibliothèque' : 'Retour' }}
            </button>

            <button
              mat-flat-button
              type="submit"
              [disabled]="pending() || loading() || demonForm().invalid()"
            >
              <mat-icon svgIcon="gi-check" /> {{ submitLabel() }}
              @if (formDirty()) {
                <span class="dw-dirty-dot" aria-label="Modifications non enregistrées"></span>
              }
            </button>
          </dw-form-header>

          <div class="grid gap-4">
            @if (loading()) {
              <div class="dw-section--loading">
                <p class="dw-section-eyebrow">
                  Chargement
                </p>
                <p class="dw-loading-detail">
                  Récupération du démon à modifier.
                </p>
              </div>
            }

            <div class="grid gap-4 xl:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] xl:items-stretch">
              <div class="dw-section--form xl:h-full">
                <bol-entity-general
                  [nom]="demonForm.nom"
                  [commentaire]="demonForm.commentaire"
                  [classement]="demonForm.id_categorie"
                  nomLabel="Nom du démon"
                  classementLabel="Catégorie"
                  [options]="categorieOptions()"
                  [compareById]="compareById"
                  [avatarPreview]="avatarPreview()"
                  avatarLabel="Changer le portrait du démon"
                  [showValidationHint]="showGeneralHint()"
                  validationHint="Le nom et la catégorie sont requis pour préparer le démon."
                  (avatarClick)="pickAvatar()"
                />
              </div>

              <div class="dw-section--form xl:h-full">
                <bol-demon-pouvoirs
                  [pouvoirs]="selectedPouvoirEntries()"
                  [pouvoirsDisponibles]="filteredPouvoirs()"
                  (added)="addPouvoirEntry($event)"
                  (removed)="removePouvoir($event)"
                />
              </div>
            </div>

            <div class="dw-section--form">
              <bol-stats-grid [form]="statsForm" [groups]="demonStatGroups" />
            </div>

            @if (errorMessage()) {
              <div class="dw-error-box">
                {{ errorMessage() }}
              </div>
            }
          </div>

          <p class="dw-forge-credit">
            Icônes :
            <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a>
            (Lorc, Delapouite et contributeurs),
            <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>
          </p>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</section>
