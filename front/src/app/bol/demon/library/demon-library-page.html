<section class="dw-page dw-lr-page xl:px-8">
  <div class="dw-lr-cadre">

    <bol-library-fond image="/assets/bol/fond-demons.webp" />

    <!-- L'en-tête, sur toute la largeur, qui ne bouge pas : le titre et le total à gauche ; à droite les actions, à la place
         qu'elles ont sur les autres écrans : créer, les bibliothèques voisines, et le retour en or. -->
    <header class="dw-lr-entete">
      <div class="dw-lr-tete">
        <p class="dw-lr-eyebrow">Bibliothèque BoL</p>
        <h1 class="dw-lr-titre">Bestiaire des démons</h1>
      </div>
      <p class="dw-lr-compte">{{ total() }}</p>
      <div class="dw-lr-actions">
        <button mat-stroked-button routerLink="/create/demon" [state]="{ returnUrl: '/library/demons' }">
          <mat-icon>add</mat-icon> Créer un démon
        </button>
        <button mat-stroked-button routerLink="/library/creatures">
          <mat-icon>pets</mat-icon> Voir les créatures
        </button>
        <button mat-stroked-button routerLink="/library/pnjs">
          <mat-icon>manage_accounts</mat-icon> Voir les PNJ
        </button>
        <button mat-flat-button [routerLink]="returnUrl() ?? '/'">
          <mat-icon>arrow_back</mat-icon> {{ returnUrl() ? 'Retour à la table' : "Retour à l'accueil" }}
        </button>
      </div>
    </header>

    <div class="dw-lr-corps">
      <!-- La barre, sous l'en-tête, sur une ligne : la recherche ; les filtres, chacun dans sa liste, qui dit sa valeur dès qu'elle est
           choisie ; le compte ; un bouton rond qui les retire tous. Les fiches sont rangées par nom.
           Les tuiles prennent toute la largeur, et défilent seules. -->
      <bol-library-barre
        placeholder="Rechercher un démon, un pouvoir, un scénario"
        [(searchTerm)]="searchTerm"
        [nombre]="compte()"
        [actifs]="filtresActifs()"
        (effacer)="clearFilters()"
      >
        <bol-library-facettes [sources]="sources()" [scenarios]="scenarios()" [(source)]="source" [(scenarioId)]="scenarioId">
          <bol-library-facette titre="Rang" tous="Tous les rangs" [total]="totalCount()" [options]="rangs()" [(valeur)]="rang" [vide]="null" />
          <bol-library-facette titre="Catégorie" tous="Toutes les catégories" [total]="totalCount()" [options]="categorieOptions()" [(valeur)]="searchCategorie" vide="" />
        </bol-library-facettes>
      </bol-library-barre>

      <!-- Une tuile par fiche : un clic ouvre son statbloc ; les fiches du compte ont leur pastille et leur menu. -->
      @if (lignes().length) {
        <ul class="dw-lr-grille" aria-label="Les démons du bestiaire">
          @for (ligne of lignes(); track ligne.demon.id) {
            <li>
              <bol-tuile [nom]="ligne.demon.nom" [image]="ligne.image" [label]="ligne.demon.nom + ', voir son statbloc'" [vitalite]="ligne.demon.vitalite" (ouvrir)="openStatblock(ligne.demon)">
                @if (ligne.mien) {
                  <span bolTuileCoin class="dw-tuile-marque">Mes fiches</span>
                }
                @if (ligne.mien) {
                  <button bolTuileMenu mat-icon-button type="button" [attr.aria-label]="'Actions de ' + ligne.demon.nom" [matMenuTriggerFor]="actions" [matMenuTriggerData]="{fiche: ligne.demon}">
                    <mat-icon>more_horiz</mat-icon>
                  </button>
                }
                <bol-rang bolTuileSous [rang]="ligne.rang" />
                <span bolTuileSous class="dw-tuile-sorte" role="img" aria-label="Démon"><mat-icon aria-hidden="true">bolt</mat-icon></span>
              </bol-tuile>
            </li>
          }
        </ul>
      } @else {
        <p class="dw-lr-vide">Aucun démon ne correspond à ces filtres.</p>
      }
    </div>
  </div>

  <mat-menu #actions="matMenu">
    <ng-template matMenuContent let-fiche="fiche">
      <a mat-menu-item [routerLink]="['/create/demon', fiche.id]" [state]="{ returnUrl: '/library/demons' }"><mat-icon>edit</mat-icon>Modifier</a>
      <button mat-menu-item type="button" (click)="askDelete(fiche)"><mat-icon>delete</mat-icon>Supprimer</button>
    </ng-template>
  </mat-menu>
</section>
