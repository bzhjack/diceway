<section class="wp-page min-h-dvh px-4 py-4 md:px-6 xl:px-8">
  <div class="mx-auto flex max-w-[1600px] flex-col gap-4">
    <bol-workspace-header [userName]="userName()" (logoutRequested)="logout()" />

    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
      @for (metric of metrics(); track metric.label) {
        <bol-workspace-metrics [metric]="metric" />
      }
    </div>

    <bol-workspace-quick-actions />
  </div>
</section>
