<mat-card
  class="wm-card"
  [class.wm-card--interactive]="metric().link"
  appearance="outlined"
  [routerLink]="metric().link ?? null"
>
  <mat-card-content>
    <div class="flex items-start justify-between gap-4">
      <div class="space-y-2">
        <p class="m-0 text-[0.72rem] font-black uppercase tracking-[0.2em] text-slate-400">
          {{ metric().label }}
        </p>
        <p class="m-0 text-4xl font-black leading-none">
          {{ metric().value }}
        </p>
        <p class="m-0 min-h-[3rem] text-sm leading-6 text-slate-300">
          {{ metric().detail }}
        </p>
      </div>

      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center text-xl"
        [class]="metric().iconClass"
      >
        <i [class]="metric().icon" aria-hidden="true"></i>
      </div>
    </div>
  </mat-card-content>
</mat-card>
