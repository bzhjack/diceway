@if (metric().link) {
  <a [routerLink]="metric().link" class="block h-full">
    <p-card
      styleClass="h-full !border !border-[#2d3748] !bg-[#2d3748]/92 !text-slate-50 !shadow-[0_18px_40px_rgba(0,0,0,0.22)] transition-transform duration-150 hover:!-translate-y-0.5 hover:!border-amber-300/60"
    >
      <div class="flex items-start justify-between gap-4">
        <div class="space-y-2">
          <p class="m-0 text-[0.72rem] font-black uppercase tracking-[0.2em] text-slate-400">
            {{ metric().label }}
          </p>
          <p class="m-0 text-4xl font-black leading-none">
            {{ metric().value }}
          </p>
          <p class="m-0 text-sm leading-6 text-slate-300">
            {{ metric().detail }}
          </p>
        </div>

        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center text-xl"
          [class]="metric().iconClass"
        >
          <i [class]="metric().icon" aria-hidden="true"></i>
        </div>
      </div>
    </p-card>
  </a>
} @else {
  <p-card
    styleClass="h-full !border !border-[#2d3748] !bg-[#2d3748]/92 !text-slate-50 !shadow-[0_18px_40px_rgba(0,0,0,0.22)]"
  >
    <div class="flex items-start justify-between gap-4">
      <div class="space-y-2">
        <p class="m-0 text-[0.72rem] font-black uppercase tracking-[0.2em] text-slate-400">
          {{ metric().label }}
        </p>
        <p class="m-0 text-4xl font-black leading-none">
          {{ metric().value }}
        </p>
        <p class="m-0 text-sm leading-6 text-slate-300">
          {{ metric().detail }}
        </p>
      </div>

      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center text-xl"
        [class]="metric().iconClass"
      >
        <i [class]="metric().icon" aria-hidden="true"></i>
      </div>
    </div>
  </p-card>
}
