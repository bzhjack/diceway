<mat-card
  class="wm-card"
  [class.wm-card--interactive]="metric().link"
  appearance="outlined"
  [routerLink]="metric().link ?? null"
>
  <mat-card-content>
    <div class="flex items-start justify-between gap-4">
      <div class="space-y-2">
        <p class="wm-label m-0">
          {{ metric().label }}
        </p>
        <p class="wm-value m-0">
          {{ metric().value }}
        </p>
        <p class="wm-detail m-0 min-h-[3rem]">
          {{ metric().detail }}
        </p>
      </div>

      <div
        class="wm-icon flex h-12 w-12 shrink-0 items-center justify-center"
        [class]="'wm-icon--' + metric().color"
      >
        <mat-icon>{{ metric().icon }}</mat-icon>
      </div>
    </div>
  </mat-card-content>
</mat-card>
