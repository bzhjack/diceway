<p-card
  styleClass="!border !border-[#2d3748] !bg-[#1a202c]/96 !text-slate-50 !shadow-[0_24px_60px_rgba(0,0,0,0.28)] backdrop-blur"
>
  <div class="space-y-5">
    <div class="space-y-2">
      <p class="m-0 text-xs font-black uppercase tracking-[0.2em] text-sky-300">
        Création rapide
      </p>
      <h2 class="m-0 font-['Muse_Display_Harmony'] text-3xl leading-none">
        Préparer avant de jouer
      </h2>
    </div>

    <div class="grid gap-2 md:grid-cols-2 xl:grid-cols-4">
      @for (action of quickActions; track action.label) {
        <div class="border border-[#424b57] bg-[#2d3748]/70 p-2.5">
          <div class="flex items-start gap-2.5">
            <div
              class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center border border-[#424b57] bg-[#334155] text-sm text-slate-100"
            >
              <i [class]="action.icon" aria-hidden="true"></i>
            </div>
            <div class="flex-1 space-y-2">
              <div class="space-y-1">
                <p class="m-0 text-sm font-bold leading-5 text-slate-100">{{ action.label }}</p>
                <p class="m-0 text-xs leading-5 text-slate-300">{{ action.detail }}</p>
              </div>
              <p-button
                label="Ouvrir"
                icon="pi pi-arrow-up-right"
                [routerLink]="action.link"
                [state]="action.state"
                severity="secondary"
                [outlined]="true"
                styleClass="!px-3 !py-1.5 !text-sm !font-bold"
              />
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</p-card>
