<mat-card class="wqa-card" appearance="outlined">
  <mat-card-content>
    <div class="space-y-5">
      <div class="space-y-2">
        <p class="wqa-eyebrow m-0">
          Création rapide
        </p>
        <h2 class="wqa-title m-0">
          Préparer avant de jouer
        </h2>
      </div>

      <div class="grid gap-2 md:grid-cols-2 xl:grid-cols-4">
        @for (action of quickActions(); track action.label) {
          <bol-workspace-action-card
            [label]="action.label"
            [detail]="action.detail"
            [icon]="action.icon"
            [link]="action.link"
            [state]="action.state"
            [advancedLink]="action.advancedLink"
            [advancedState]="action.advancedState"
          />
        }
      </div>
    </div>
  </mat-card-content>
</mat-card>
