<mat-card class="wsh-header-card" appearance="outlined">
  <mat-card-content>
    <div class="flex flex-col gap-6 xl:flex-row xl:items-start xl:justify-between">
      <div class="max-w-4xl space-y-4">
        <div class="space-y-2">
          <div class="flex flex-col gap-0.5">
            <p class="wsh-eyebrow m-0">
              Barbarians of Lemuria
            </p>
            <p class="wsh-subeyebrow m-0">
              Dashboard MJ
            </p>
          </div>
          <h1 class="wsh-title m-0">
            Vue globale avant session
          </h1>
        </div>

        <p class="wsh-description m-0 max-w-3xl">
          Tu vois ici tes scénarios, tes héros, tes PNJ et tes ressources sans entrer dans la scène.
          Depuis ce hub, tu peux créer, préparer puis seulement ensuite basculer dans la session live.
        </p>

        <div class="flex flex-wrap gap-1.5">
          <dw-tag>MJ connecté</dw-tag>
          <dw-tag>{{ userName() }}</dw-tag>
          <dw-tag>1 session prête</dw-tag>
        </div>
      </div>

      <button mat-stroked-button size="small" (click)="requestLogout()">
        <mat-icon>logout</mat-icon> Déconnexion
      </button>
    </div>
  </mat-card-content>
</mat-card>
