<p-card class="dw-card--header">
  <div class="flex flex-col gap-4">
    <div class="space-y-2.5">
      <div class="space-y-1.5">
        <p class="m-0 text-xs font-black uppercase tracking-[0.22em] text-sky-300">
          Dashboard MJ
        </p>
        <h1 class="m-0 font-['Muse_Display_Harmony'] text-4xl leading-none md:text-[2.8rem]">
          Vue globale avant session
        </h1>
      </div>

      <p class="m-0 max-w-3xl text-sm leading-6 text-slate-300 md:text-[0.95rem]">
        Tu vois ici tes scénarios, tes héros, tes PNJ et tes ressources sans entrer dans la scène.
        Depuis ce hub, tu peux créer, préparer puis seulement ensuite basculer dans la session live.
      </p>

      <div class="flex flex-wrap gap-1.5">
        <p-tag value="MJ connecté" severity="contrast" />
        <p-tag [value]="userName()" severity="info" />
        <p-tag value="1 session prête" severity="success" />
      </div>
    </div>

    <div class="library-header-actions flex flex-wrap items-center justify-between gap-1.5">
      <div class="flex flex-wrap gap-1.5">
        <span class="library-header-actions__primary">
          <p-button
            label="Entrer dans la session"
            icon="pi pi-play-circle"
            [routerLink]="'/session/live'"
            severity="info"
            size="small"
          />
        </span>
        <p-button
          label="Créer un scénario"
          icon="pi pi-compass"
          [routerLink]="'/create/scenario'"
          severity="secondary"
          size="small"
          [outlined]="true"
        />
      </div>
      <p-button
        label="Déconnexion"
        icon="pi pi-sign-out"
        severity="secondary"
        size="small"
        [outlined]="true"
        (onClick)="requestLogout()"
      />
    </div>
  </div>
</p-card>
