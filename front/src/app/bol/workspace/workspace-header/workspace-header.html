<p-card
  styleClass="!border !border-[#2d3748] !bg-[#1a202c]/96 !text-slate-50 !shadow-[0_28px_70px_rgba(0,0,0,0.35)] backdrop-blur"
>
  <div class="flex flex-col gap-6 xl:flex-row xl:items-start xl:justify-between">
    <div class="max-w-4xl space-y-4">
      <div class="space-y-2">
        <p class="m-0 text-xs font-black uppercase tracking-[0.28em] text-sky-300">
          Dashboard MJ
        </p>
        <h1 class="m-0 font-['Muse_Display_Harmony'] text-4xl leading-none md:text-5xl">
          Vue globale avant session
        </h1>
      </div>

      <p class="m-0 max-w-3xl text-sm leading-7 text-slate-300 md:text-base">
        Tu vois ici tes campagnes, tes tables, tes héros et tes PNJ sans entrer dans la scène. Depuis
        ce hub, tu peux créer, préparer puis seulement ensuite basculer dans la session live.
      </p>

      <div class="flex flex-wrap gap-2">
        <p-tag value="MJ connecté" severity="contrast" />
        <p-tag [value]="userName()" severity="info" />
        <p-tag value="1 session prête" severity="success" />
      </div>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row xl:flex-col">
      <p-button
        label="Entrer dans la session"
        icon="pi pi-play-circle"
        [routerLink]="'/session/live'"
        styleClass="!bg-[#2563eb] !border-[#2563eb] !text-white !px-5 !py-3 !font-bold"
      />
      <p-button
        label="Créer une session"
        icon="pi pi-calendar-plus"
        [routerLink]="'/create/session'"
        severity="secondary"
        styleClass="!px-5 !py-3 !font-bold"
      />
      <p-button
        label="Déconnexion"
        icon="pi pi-sign-out"
        severity="contrast"
        [outlined]="true"
        (onClick)="requestLogout()"
        styleClass="!px-5 !py-3 !font-bold"
      />
    </div>
  </div>
</p-card>
