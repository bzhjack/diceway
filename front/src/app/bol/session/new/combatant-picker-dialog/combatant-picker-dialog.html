<h2 mat-dialog-title>Ajouter un combattant</h2>

<mat-dialog-content>
  <div class="cpd-filters">
    @if (!lockKind) {
      <div class="cpd-tabs" role="group" aria-label="Type de combattant">
        <button type="button" class="cpd-tab" [class.cpd-tab--active]="activeType() === 'all'" [attr.aria-pressed]="activeType() === 'all'" (click)="setType('all')">
          Tous
        </button>
        <button type="button" class="cpd-tab" [class.cpd-tab--active]="activeType() === 'hero'" [attr.aria-pressed]="activeType() === 'hero'" (click)="setType('hero')">
          Héros
        </button>
        <button type="button" class="cpd-tab" [class.cpd-tab--active]="activeType() === 'pnj'" [attr.aria-pressed]="activeType() === 'pnj'" (click)="setType('pnj')">
          PNJ
        </button>
        <button type="button" class="cpd-tab" [class.cpd-tab--active]="activeType() === 'creature'" [attr.aria-pressed]="activeType() === 'creature'" (click)="setType('creature')">
          Créatures
        </button>
        <button type="button" class="cpd-tab" [class.cpd-tab--active]="activeType() === 'demon'" [attr.aria-pressed]="activeType() === 'demon'" (click)="setType('demon')">
          Démons
        </button>
      </div>
    }

    <mat-form-field subscriptSizing="dynamic" class="cpd-search">
      <mat-label>Rechercher</mat-label>
      <input matInput [formField]="queryField" placeholder="Nom du combattant…" />
    </mat-form-field>
  </div>

  <div class="cpd-grid">
    @for (entry of filteredCatalog(); track entry.catalogId) {
      <bol-catalog-card [entry]="entry" />
    } @empty {
      <p class="cpd-empty">Aucun résultat.</p>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button type="button" (click)="close()">Fermer</button>
</mat-dialog-actions>
