@if (loading()) {
  <div class="cp-status">Chargement de la table…</div>
} @else if (errorMessage()) {
  <div class="cp-status cp-status--error">
    <p>{{ errorMessage() }}</p>
    <a routerLink="/library/sessions">Voir mes sessions</a>
  </div>
} @else if (board(); as b) {
  <div class="cp-page cp-page--barbare">
    <div class="cp-table">
    <bol-session-header
      [mode]="mode()"
      [titre]="headerTitle()"
      [legendaryActive]="b.legendaryActive"
      (startCombat)="openStartCombatDialog()"
      (endCombat)="askEndCombat()"
      (search)="openPalette()"
    />

    @if (sessionId(); as sid) {
      @if (mode() === 'libre') {
        <!-- Mode libre : la réserve et le tapis. -->
        <div class="spp-body">
          @if (reserveOpen()) {
            <aside id="spp-reserve" class="spp-reserve" aria-label="Réserve">
              <bol-reserve
                [sessionId]="sid"
                [existingHeroIds]="existingHeroIds()"
                [currentSceneId]="session()?.scene_id ?? null"
                [nonHeroCount]="nonHeroCount()"
                (sceneChanged)="onSceneChanged()"
                (placed)="reloadSession()"
              />
            </aside>
          }

          <button
            type="button"
            class="spp-reserve-toggle"
            aria-controls="spp-reserve"
            [attr.aria-expanded]="reserveOpen()"
            [attr.aria-label]="reserveOpen() ? 'Replier la réserve' : 'Déplier la réserve'"
            [matTooltip]="reserveOpen() ? 'Replier la réserve' : 'Déplier la réserve'"
            matTooltipPosition="right"
            (click)="toggleReserve()"
          >
            <mat-icon>{{ reserveOpen() ? 'chevron_left' : 'chevron_right' }}</mat-icon>
            @if (!reserveOpen()) {
              <span class="spp-reserve-toggle-label">Réserve</span>
            }
          </button>

          <div class="spp-main">
            <bol-tapis
              [cards]="cards()"
              [sessionId]="sid"
              [selectedKeys]="selectedKeys()"
              (selectToggled)="toggleSelected($event)"
              (cardToggled)="onCardToggled($event)"
              (campToggleRequested)="toggleCamp($event)"
            />
          </div>
        </div>
      } @else {
        <!-- Mode combat : l'écran de combat, sans réserve ni tapis. -->
        <bol-combat-board
          [entries]="turnEntries()"
          [round]="etat().round"
          [title]="headerTitle() ?? ''"
          [legendaryActive]="b.legendaryActive"
          [announcement]="turnAnnouncement()"
          [activeCard]="activeCard()"
          [armes]="activeArmes()"
          [combatOptions]="combatOptions()"
          [targets]="targets()"
          [target]="selectedTarget()"
          [attacker]="attackerStats()"
          [targetStats]="targetStats()"
          [legendaryBonus]="legendaryForActive()"
          [heroes]="sideHeroes()"
          [log]="combatLog()"
          (gaveBack)="onGiveBackTurn($event)"
          (addRequested)="openAddCombatantDialog()"
          (delayRequested)="onDelay()"
          (rerollRequested)="openStartCombatDialog(true)"
          (endTurnRequested)="onEndTurn()"
          (choiceChanged)="attackChoice.set($event)"
          (targetSelected)="onAttackCard($event)"
          (damageApplied)="onHitApplied($event)"
          (detailedRequested)="onDetailedAttack()"
          (totalDefenseRequested)="onTotalDefense()"
        />
      }
    }
    </div>
  </div>
}
