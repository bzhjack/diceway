@if (loading()) {
  <div class="cp-status">Chargement de la table…</div>
} @else if (errorMessage()) {
  <div class="cp-status cp-status--error">
    <p>{{ errorMessage() }}</p>
    <a routerLink="/library/sessions">Voir mes sessions</a>
  </div>
} @else if (board(); as b) {
  <div class="cp-page cp-page--barbare">
    <div class="cp-table">
    <bol-session-header
      [mode]="mode()"
      [titre]="headerTitle()"
      (startCombat)="openStartCombat()"
      (endCombat)="askEndCombat()"
      (search)="openPalette()"
      [coulissesOpen]="reserveOpen()"
      (coulissesToggled)="toggleReserve()"
      [interrupters]="interrupters()"
      [deMj]="etat().deMj"
      (deMjChanged)="setDeMj($event)"
      (interruptRequested)="onInterrupt($event)"
      (rerollRequested)="openStartCombat(true)"
    >
      @if (mode() === 'libre') {
        <bol-scene-acts [sessionTitre]="session()?.titre ?? null" (sceneChanged)="onSceneLoaded($event)" />
      } @else {
        <!-- En combat, l'ordre d'action en seconde rangée de l'en-tête, comme les modificateurs sur la page du jet de réaction -->
        <bol-turn-order
          cpHeaderRow
          [entries]="turnEntries()"
          [round]="etat().round"
          [targetKey]="selectedTarget()?.key ?? null"
          [legendaryActive]="b.legendaryActive"
          [announcement]="turnAnnouncement()"
          (gaveBack)="onGiveBackTurn($event)"
          (addRequested)="openAddCombatantDialog()"
        />
      }
    </bol-session-header>

    @if (sessionId(); as sid) {
      @if (mode() === 'libre') {
        <!-- Mode libre : le théâtre, et les coulisses (la réserve) à droite. -->
        <mat-sidenav-container class="spp-coulisses" [hasBackdrop]="false">
          <mat-sidenav
            id="spp-coulisses-panel"
            class="spp-coulisses-panel"
            position="end"
            mode="side"
            role="complementary"
            aria-label="Coulisses"
            [opened]="reserveOpen()"
            (openedChange)="onCoulissesChange($event)"
          >
            <div class="spp-coulisses-inner">
              <div class="spp-coulisses-tete">
                <h2 class="spp-coulisses-titre">Coulisses</h2>
                <button mat-icon-button type="button" aria-label="Fermer les coulisses" (click)="setReserveOpen(false)">
                  <mat-icon>close</mat-icon>
                </button>
              </div>
              <bol-reserve
                [titre]="null"
                [sessionId]="sid"
                [existingHeroIds]="existingHeroIds()"
                [currentSceneId]="session()?.scene_id ?? null"
                [nonHeroCount]="nonHeroCount()"
                (sceneChanged)="onSceneChanged()"
                (placed)="reloadSession()"
              />
            </div>
          </mat-sidenav>
          <mat-sidenav-content class="spp-scene">
            <bol-theatre
              [cards]="cards()"
              [sessionId]="sid"
              [selectedKeys]="selectedKeys()"
              (cardToggled)="onCardToggled($event)"
              (selectToggled)="toggleSelected($event)"
              (campToggleRequested)="toggleCamp($event)"
              (sceneChanged)="onSceneLoaded($event)"
              (changed)="reloadSession()"
              (coulissesRequested)="setReserveOpen(true)"
            />
          </mat-sidenav-content>
        </mat-sidenav-container>
      } @else {
        <!-- Mode combat : l'écran de combat, sans réserve ni tapis. -->
        <bol-combat-board
          [effets]="effetsAffiches()"
          [deMj]="etat().deMj"
          [activeCard]="activeCard()"
          [armes]="assistantArmes()"
          [ownedArmes]="activeOwnedArmes()"
          [combatOptions]="combatOptions()"
          [targets]="targets()"
          [target]="selectedTarget()"
          [attacker]="attackerStats()"
          [targetStats]="targetStats()"
          [targetsStats]="targetsStats()"
          [legendaryBonus]="legendaryForActive()"
          [canRescue]="rescuePatients().length > 0"
          [hordeMates]="hordeMates()"
          (hordeChanged)="hordeKeys.set($event)"
          [carrieres]="activeCarrieres()"
          (delayRequested)="onDelay()"
          (endTurnRequested)="onEndTurn($event)"
          (choiceChanged)="attackChoice.set($event)"
          (targetSelected)="onAttackCard($event)"
          (sheetRequested)="onCardToggled($event)"
          (attackRolled)="onAttackRolled($event)"
          (effectRemoved)="onEffectRemoved($event)"
          (effectAdded)="onEffectAdded($event)"
          (damageApplied)="onHitApplied($event)"
          (totalDefenseRequested)="onTotalDefense()"
          (rescueRequested)="onRescue()"
          (heroismeAdjusted)="onHeroismeAdjusted($event)"
          (vitaliteAdjusted)="onVitaliteAdjusted($event)"
          (targetHeroismeAdjusted)="onTargetHeroismeAdjusted($event)"
        />
      }
    }
    <bol-rideau [etat]="stage.rideau()" [carton]="stage.carton()" />
    </div>
  </div>
}
