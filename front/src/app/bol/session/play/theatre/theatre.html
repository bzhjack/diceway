<div class="thr" [class.thr--sans-scene]="!store.displayedScene()">
  <!-- Le bandeau de la scène, second étage de l'en-tête, sur toute la largeur et sur le décor (que la page étend derrière lui) : où
       elle se joue, son titre et son ambiance ; à droite, les deux actions de la table. -->
  <section class="thr-bandeau" aria-label="La scène">
    <bol-braises class="thr-braises" />
    <bol-scene-cartouche class="thr-cartouche" [scene]="store.displayedScene()" [regionNom]="regionNom()" [acte]="store.currentActe()" [total]="store.acts().length" />
    <div class="thr-actions">
      <button
        mat-stroked-button
        type="button"
        class="thr-ajouter"
        aria-controls="spp-coulisses-panel"
        [attr.aria-expanded]="coulissesOpen()"
        (click)="coulissesRequested.emit()"
      >
        <mat-icon>person_add</mat-icon> Ajouter un personnage
      </button>
      <button mat-flat-button type="button" (click)="combatRequested.emit()"><mat-icon svgIcon="sword" /> Démarrer un combat</button>
    </div>
  </section>

  <!-- Au centre, le carnet du MJ : le texte à lire, ce qui se joue, le secret, les pistes ; il défile seul. -->
  @if (store.displayedScene(); as scene) {
    <bol-scene-lecture class="thr-carnet" [scene]="scene" [acts]="store.acts()" (sceneChanged)="sceneChanged.emit($event)" (grandToggled)="agrandirLecture()" />
  }

  <!-- La situation, de part et d'autre du carnet : la compagnie à gauche, ceux d'en face à droite. Ses deux camps se placent eux-mêmes
       dans la grille. -->
  <bol-situation
    [cards]="cards()"
    [sessionId]="sessionId()"
    [selectedKeys]="selectedKeys()"
    (cardToggled)="cardToggled.emit($event)"
    (selectToggled)="selectToggled.emit($event)"
    (campToggleRequested)="campToggleRequested.emit($event)"
    (changed)="changed.emit($event)"
  />
</div>
