<div class="thr" [class.thr--avec-carnet]="!!store.displayedScene()">
  <!-- Le carnet du MJ : le texte à lire, ce qui se joue, le secret, les pistes ; il défile seul. -->
  @if (store.displayedScene(); as scene) {
    <bol-scene-lecture class="thr-carnet" [scene]="scene" [acts]="store.acts()" (sceneChanged)="sceneChanged.emit($event)" (grandToggled)="agrandirLecture()" />
  }

  <div class="thr-droite">
    <!-- Le bandeau de la scène : son décor et ses braises derrière ; devant, où elle se joue, son ambiance, puis ce qu'on y fait (hors du
         cartouche, qui annonce chaque scène aux lecteurs d'écran). -->
    <section class="thr-bandeau" aria-label="La scène">
      <bol-scene-decor class="thr-decor" [scene]="store.displayedScene()" />
      <bol-braises class="thr-braises" />
      <div class="thr-tete">
        <bol-scene-cartouche
          class="thr-cartouche"
          [scene]="store.displayedScene()"
          [regionNom]="regionNom()"
          [acte]="store.currentActe()"
          [total]="store.acts().length"
        />
        <div class="thr-actions">
          <button
            mat-stroked-button
            type="button"
            class="thr-ajouter"
            aria-controls="spp-coulisses-panel"
            [attr.aria-expanded]="coulissesOpen()"
            (click)="coulissesRequested.emit()"
          >
            <mat-icon>person_add</mat-icon> Ajouter des personnages
          </button>
          <button mat-flat-button type="button" (click)="combatRequested.emit()"><mat-icon svgIcon="sword" /> Démarrer un combat</button>
        </div>
      </div>
    </section>

    <!-- La situation : chacun sur sa ligne, ceux d'en face puis la compagnie. -->
    <bol-situation
      class="thr-situation"
      [cards]="cards()"
      [sessionId]="sessionId()"
      [selectedKeys]="selectedKeys()"
      (cardToggled)="cardToggled.emit($event)"
      (selectToggled)="selectToggled.emit($event)"
      (campToggleRequested)="campToggleRequested.emit($event)"
      (changed)="changed.emit($event)"
    />
  </div>
</div>
