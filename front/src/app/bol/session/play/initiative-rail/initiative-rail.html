<div
  class="cp-rail"
  role="list"
  aria-label="Ordre d'initiative — glisser-déposer pour réordonner"
  cdkDropList
  cdkDropListOrientation="horizontal"
  (cdkDropListDropped)="onDrop($event)"
>
  @for (token of tokens(); track token.key; let last = $last) {
    <div class="cp-rail-item-wrap" cdkDrag [attr.title]="token.nom">
      <div class="cp-rail-item">
        <div [class]="chipClass(token)">
          <img [src]="token.avatar" [alt]="token.nom" />
          <span [class]="'cp-rail-kind cp-rail-kind--' + token.kind">
            @if (kindIconIsSvg(token.kind)) {
              <mat-icon [svgIcon]="kindIcon(token.kind)" />
            } @else {
              <mat-icon>{{ kindIcon(token.kind) }}</mat-icon>
            }
          </span>
          <button
            type="button"
            class="cp-rail-remove"
            [attr.aria-label]="'Retirer ' + token.nom"
            (click)="onRemove(token, $event)"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <span class="cp-rail-name">{{ token.nom }}</span>
      </div>
      @if (!last) {
        <mat-icon class="cp-rail-arrow">chevron_right</mat-icon>
      }
    </div>
  }

  <div class="cp-rail-item-wrap cp-rail-item-wrap--static">
    <mat-icon class="cp-rail-arrow">chevron_right</mat-icon>
    <button type="button" class="cp-rail-item cp-rail-add" (click)="addCombatant.emit()">
      <span class="cp-rail-chip cp-rail-chip--add">
        <mat-icon>add</mat-icon>
      </span>
      <span class="cp-rail-name">Ajouter</span>
    </button>
  </div>
</div>
