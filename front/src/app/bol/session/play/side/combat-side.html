<section class="cs-block" aria-label="Héros">
  <h3 class="cs-title">Héros</h3>
  @for (hero of heroes(); track hero.key) {
    <div class="cs-hero">
      <b>{{ hero.nom }}</b>
      <span class="cs-bar" [class.cs-bar--low]="low(hero)"><i [style.width.%]="percent(hero)"></i></span>
      <span class="cs-num">{{ hero.vitaliteCourante ?? '—' }}</span>
    </div>
  } @empty {
    <p class="cs-note">Aucun héros à la table.</p>
  }
</section>

<section class="cs-block" aria-label="Journal">
  <h3 class="cs-title">Journal</h3>
  @for (line of log(); track $index) {
    <p class="cs-line">{{ line }}</p>
  } @empty {
    <p class="cs-note">Les coups portés s'écrivent ici.</p>
  }
</section>
