@if (armureEntries().length) {
  <div class="hsd-toolbar">
    <button mat-stroked-button type="button" class="hsd-modify-trigger" [matMenuTriggerFor]="editMenu">
      <mat-icon>checkroom</mat-icon> Équipement
    </button>
  </div>

  <mat-menu #editMenu="matMenu" class="hsd-edit-menu-panel">
    <div class="hsd-edit-menu-content" (click)="$event.stopPropagation()">
      <bol-armure-list [armures]="armureEntries()" [removeEnabled]="false" (equippedToggled)="toggleArmureEquipped($event)" />
    </div>
  </mat-menu>
}

<div class="hsd-content">
  <bol-statblock [data]="data().statblock" [imageSrc]="data().avatar" [returnUrl]="data().returnUrl">
    <bol-hero-resources
      statblockHeaderExtra
      class="hsd-header-steppers"
      [data]="data()"
      [(heroisme)]="heroisme"
      (changed)="changed.emit()"
    />
  </bol-statblock>
</div>
