<header class="cp-header" [class.cp-header--combat]="mode() === 'combat'" [class.cp-header--theatre]="mode() === 'libre'">
  @if (mode() === 'combat') {
    <div class="cp-header-title">
      <span class="cp-eyebrow">Combat</span>
      <h1 [attr.title]="titre() || null">{{ titre() || 'Combat en cours' }}</h1>
    </div>
  }
  <!-- Projeté par la page : en mode libre, le titre du scénario et la frise des actes. -->
  <div class="cp-header-center"><ng-content /></div>

  <!-- Les actions à droite, groupées comme sur la page du jet de réaction : en icône ronde cerclée, sauf l'action principale en toutes
       lettres ; en combat, d'abord les commandes du round (interrompre, nouveau jet de réaction) -->
  <div class="cp-header-actions">
    @if (mode() === 'combat') {
      <!-- Les options du combat, dans un popover : le dé du MJ pour tous, qui se lit sur le bouton (un petit dé vert ou rouge) -->
      <button
        mat-stroked-button
        type="button"
        id="cp-options-btn"
        class="cp-options-btn"
        cdkOverlayOrigin
        #optionsOrigin="cdkOverlayOrigin"
        aria-haspopup="dialog"
        [attr.aria-expanded]="optionsOpen()"
        matTooltip="Dé du MJ pour tous"
        (click)="optionsOpen.set(!optionsOpen())"
      >
        <mat-icon svgIcon="gi-tune" /> Options
        @if (deMj(); as de) {
          <span [class]="'cp-options-die cp-options-die--' + de"
            ><mat-icon svgIcon="gi-dice" /><span class="cdk-visually-hidden">, dé de {{ de }} du MJ pour tous</span></span
          >
        }
      </button>
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="optionsOrigin"
        [cdkConnectedOverlayOpen]="optionsOpen()"
        [cdkConnectedOverlayPositions]="optionsPositions"
        [cdkConnectedOverlayPush]="true"
        [cdkConnectedOverlayViewportMargin]="12"
        [cdkConnectedOverlayHasBackdrop]="true"
        cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
        (backdropClick)="closeOptions()"
        (overlayKeydown)="onOptionsKeydown($event)"
        (detach)="optionsOpen.set(false)"
      >
        <div class="cp-pop" role="dialog" aria-label="Options du combat" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
          <p class="cp-pop-title">Options du combat</p>
          <div class="cp-pop-group" role="group" aria-labelledby="cp-gm-all-label">
            <span class="cp-pop-label" id="cp-gm-all-label">Dé du MJ pour tous</span>
            <div class="cp-seg">
              <button type="button" [attr.aria-pressed]="deMj() === null" (click)="deMjChanged.emit(null)">Aucun</button>
              <button type="button" class="cp-seg--bonus" [attr.aria-pressed]="deMj() === 'bonus'" (click)="deMjChanged.emit('bonus')">
                Dé de bonus
              </button>
              <button type="button" class="cp-seg--malus" [attr.aria-pressed]="deMj() === 'malus'" (click)="deMjChanged.emit('malus')">
                Dé de malus
              </button>
            </div>
            <span class="cp-pop-hint">Ajouté à chaque jet d'attaque des héros, tant qu'il est choisi.</span>
          </div>
        </div>
      </ng-template>
      @for (i of interrupters(); track i.key) {
        <button
          mat-stroked-button
          type="button"
          matTooltip="A retardé son action : 1 point d'héroïsme pour agir tout de suite, avant la carte active"
          (click)="interruptRequested.emit(i.key)"
        >
          Interrompre : {{ i.nom }} (−1 PH)
        </button>
      }
      <button
        mat-icon-button
        type="button"
        class="cp-head-icon"
        aria-label="Nouveau jet de réaction"
        matTooltip="Nouveau jet de réaction des héros"
        (click)="rerollRequested.emit()"
      >
        <mat-icon svgIcon="gi-reroll" />
      </button>
    }
    <button
      mat-icon-button
      type="button"
      class="cp-head-icon"
      aria-label="Rechercher ou lancer une action ( / )"
      matTooltip="Rechercher ou lancer une action ( / )"
      (click)="searchRequested.emit()"
    >
      <mat-icon svgIcon="gi-search" />
    </button>
    @if (mode() === 'libre') {
      <button
        mat-icon-button
        type="button"
        class="cp-head-icon"
        aria-label="Coulisses"
        aria-controls="spp-coulisses-panel"
        [attr.aria-expanded]="coulissesOpen()"
        [matTooltip]="coulissesOpen() ? 'Fermer les coulisses' : 'Coulisses : les personnages en réserve'"
        (click)="coulissesToggled.emit()"
      >
        <mat-icon svgIcon="gi-masks" />
      </button>
      <button mat-flat-button type="button" (click)="startCombat.emit()"><mat-icon svgIcon="gi-swords" /> Démarrer un combat</button>
    } @else {
      <!-- L'action principale de l'en-tête, en or plein comme « Démarrer un combat » -->
      <button mat-flat-button type="button" (click)="endCombat.emit()"><mat-icon svgIcon="gi-flag" /> Terminer</button>
    }
    <bol-account-menu />
  </div>

  <!-- Une seconde rangée, projetée par la page : en combat, l'ordre d'action -->
  <ng-content select="[cpHeaderRow]" />
</header>
