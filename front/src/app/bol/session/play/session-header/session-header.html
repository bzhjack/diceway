<header class="cp-header" [class.cp-header--combat]="mode() === 'combat'" [class.cp-header--theatre]="mode() === 'libre'">
  @if (mode() === 'combat') {
    <div class="cp-header-title">
      <span class="cp-eyebrow">Combat</span>
      <h1 [attr.title]="titre() || null">{{ titre() || 'Combat en cours' }}</h1>
    </div>
  }
  <!-- Projeté par la page : en mode libre, le titre du scénario et la frise des actes ; en combat, l'ordre d'action. -->
  <div class="cp-header-center"><ng-content /></div>

  <div class="cp-header-actions">
    <button
      mat-icon-button
      type="button"
      class="cp-header-search"
      aria-label="Rechercher ou lancer une action ( / )"
      matTooltip="Rechercher ou lancer une action ( / )"
      (click)="search.emit()"
    >
      <mat-icon>search</mat-icon>
    </button>
    @if (mode() === 'libre') {
      <button matButton="outlined" type="button" aria-controls="spp-coulisses-panel" [attr.aria-expanded]="coulissesOpen()" (click)="coulissesToggled.emit()">
        <mat-icon>theater_comedy</mat-icon> Coulisses
      </button>
      <button mat-flat-button type="button" (click)="startCombat.emit()"><mat-icon svgIcon="sword" /> Démarrer un combat</button>
    } @else {
      <!-- L'action principale de l'en-tête, en or plein comme « Démarrer un combat » -->
      <button mat-flat-button type="button" (click)="endCombat.emit()"><mat-icon>flag</mat-icon> Terminer</button>
    }
    <bol-account-menu />
  </div>
</header>
