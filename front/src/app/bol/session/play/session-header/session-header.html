<header class="cp-header" [class.cp-header--combat]="mode() === 'combat'" [class.cp-header--theatre]="mode() === 'libre'">
  @if (mode() === 'combat') {
    <div class="cp-header-title">
      <span class="cp-eyebrow">Combat</span>
      <h1 [attr.title]="titre() || null">{{ titre() || 'Combat en cours' }}</h1>
    </div>
  }
  <!-- Projeté par la page : en mode libre, le titre du scénario et la frise des actes. -->
  <div class="cp-header-center"><ng-content /></div>

  <!-- Les actions à droite, groupées comme sur la page du jet de réaction : en icône ronde cerclée, sauf l'action principale en toutes
       lettres ; en combat, d'abord les commandes du round (interrompre, nouveau jet de réaction) -->
  <div class="cp-header-actions">
    @if (mode() === 'combat') {
      @for (i of interrupters(); track i.key) {
        <button
          mat-stroked-button
          type="button"
          matTooltip="A retardé son action : 1 point d'héroïsme pour agir tout de suite, avant la carte active"
          (click)="interruptRequested.emit(i.key)"
        >
          Interrompre : {{ i.nom }} (−1 PH)
        </button>
      }
      <button
        mat-icon-button
        type="button"
        class="cp-head-icon"
        aria-label="Nouveau jet de réaction"
        matTooltip="Nouveau jet de réaction des héros"
        (click)="rerollRequested.emit()"
      >
        <mat-icon>replay</mat-icon>
      </button>
    }
    <button
      mat-icon-button
      type="button"
      class="cp-head-icon"
      aria-label="Rechercher ou lancer une action ( / )"
      matTooltip="Rechercher ou lancer une action ( / )"
      (click)="search.emit()"
    >
      <mat-icon>search</mat-icon>
    </button>
    @if (mode() === 'libre') {
      <button
        mat-icon-button
        type="button"
        class="cp-head-icon"
        aria-label="Coulisses"
        aria-controls="spp-coulisses-panel"
        [attr.aria-expanded]="coulissesOpen()"
        [matTooltip]="coulissesOpen() ? 'Fermer les coulisses' : 'Coulisses : les personnages en réserve'"
        (click)="coulissesToggled.emit()"
      >
        <mat-icon>theater_comedy</mat-icon>
      </button>
      <button mat-flat-button type="button" (click)="startCombat.emit()"><mat-icon svgIcon="sword" /> Démarrer un combat</button>
    } @else {
      <!-- L'action principale de l'en-tête, en or plein comme « Démarrer un combat » -->
      <button mat-flat-button type="button" (click)="endCombat.emit()"><mat-icon>flag</mat-icon> Terminer</button>
    }
    <bol-account-menu />
  </div>

  <!-- Une seconde rangée, projetée par la page : en combat, l'ordre d'action -->
  <ng-content select="[cpHeaderRow]" />
</header>
