<!-- Sous la barre de titre, comme sur la page du jet de réaction : l'ordre d'action en frise, sa légende au-dessus, et au bout le « + »
     qui ajoute un combattant -->
<section class="tor" aria-label="Ordre d’action">
  <bol-ordre-frise
    class="tor-frise"
    [legende]="true"
    [round]="round()"
    [steps]="steps()"
    addLabel="Ajouter un combattant"
    (stepClicked)="gaveBack.emit($event.key)"
    (addClicked)="addRequested.emit()"
  >
    @if (roundOneLock()) {
      <span
        class="tor-pill"
        [class.tor-pill--lock]="legendaryActive()"
        [matTooltip]="'Succès ' + (legendaryActive() ? 'légendaire' : 'héroïque') + ' : coriaces et piétaille bloqués au round 1'"
      >
        {{ legendaryActive() ? 'Légendaire' : 'Héroïque' }} · bloqués
      </span>
    }
  </bol-ordre-frise>
  <p class="tor-live" aria-live="polite">{{ announcement() }}</p>
</section>
