<div class="tps">
  <ng-container *ngTemplateOutlet="presentsTpl" />
  <ng-container *ngTemplateOutlet="herosTpl" />
</div>

<ng-template #presentsTpl>
  <section
    class="tps-row"
    data-drop-camp="adversaires"
    [class.tps-row--droppable]="adversairesDroppable()"
    [class.tps-row--hot]="hotCamp() === 'adversaires'"
    aria-labelledby="tps-presents-label"
  >
    <h2 class="tps-row-label" id="tps-presents-label">Présents dans la scène</h2>
    <ng-container
      *ngTemplateOutlet="
        rowTpl;
        context: {cards: rows().presents, labelId: 'tps-presents-label', scrollerLabel: 'Présents dans la scène', empty: 'Personne ici pour l’instant. Pose des personnages depuis la réserve.'}
      "
    />
  </section>
</ng-template>

<ng-template #herosTpl>
  <section
    class="tps-row tps-row--heros"
    data-drop-camp="heros"
    [class.tps-row--droppable]="herosDroppable()"
    [class.tps-row--hot]="hotCamp() === 'heros'"
    aria-labelledby="tps-heros-label"
  >
    <ng-container
      *ngTemplateOutlet="rowTpl; context: {cards: rows().heros, labelId: 'tps-heros-label', scrollerLabel: 'Héros et alliés', empty: 'Aucun héros à table.'}"
    />
    <h2 class="tps-row-label" id="tps-heros-label">Héros et alliés</h2>
  </section>
</ng-template>

<ng-template #rowTpl let-cards="cards" let-labelId="labelId" let-empty="empty" let-scrollerLabel="scrollerLabel">
  <dw-scroller class="tps-scroller" [label]="scrollerLabel">
  <ul
    class="tps-cards"
    role="list"
    cdkDropList
    [cdkDropListSortingDisabled]="true"
    [cdkDropListEnterPredicate]="rejectDrop"
    [attr.aria-labelledby]="labelId"
  >
    @for (card of cards; track card.key) {
      <li
        class="tps-slot"
        cdkDrag
        cdkDragPreviewContainer="parent"
        [cdkDragDisabled]="!canChangeCamp(card)"
        (cdkDragStarted)="onCardDragStarted(card)"
        (cdkDragMoved)="onCardDragMoved($event)"
        (cdkDragEnded)="onCardDragEnded($event, card)"
      >
        <bol-character-card
          [card]="card"
          [selected]="selectedKeys().has(card.key)"
          (toggled)="onFaceClick(card, $event)"
        />
        <div *cdkDragPreview class="tps-ghost">
          <img class="tps-ghost-art" [src]="card.avatar" alt="" draggable="false" />
          <span class="tps-ghost-name">{{ card.nom }}</span>
        </div>
      </li>
    } @empty {
      <li class="tps-empty">{{ empty }}</li>
    }
  </ul>
  </dw-scroller>

</ng-template>
