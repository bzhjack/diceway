<div class="tps">
  <ng-container *ngTemplateOutlet="presentsTpl" />
  <ng-container *ngTemplateOutlet="middleTpl" />
  <ng-container *ngTemplateOutlet="herosTpl" />
</div>

<ng-template #presentsTpl>
  <section class="tps-row" aria-labelledby="tps-presents-label">
    <h2 class="tps-row-label" id="tps-presents-label">{{ presentsLabel() }}</h2>
    <ng-container
      *ngTemplateOutlet="
        rowTpl;
        context: {cards: rows().presents, labelId: 'tps-presents-label', scrollerLabel: presentsLabel(), empty: 'Personne ici pour l’instant. Pose des personnages depuis la réserve.'}
      "
    />
  </section>
</ng-template>

<ng-template #herosTpl>
  <section class="tps-row tps-row--heros" aria-labelledby="tps-heros-label">
    <ng-container
      *ngTemplateOutlet="rowTpl; context: {cards: rows().heros, labelId: 'tps-heros-label', scrollerLabel: 'Héros et alliés', empty: 'Aucun héros à table.'}"
    />
    <h2 class="tps-row-label" id="tps-heros-label">Héros et alliés</h2>
  </section>
</ng-template>

<ng-template #middleTpl>
  @if (mode() === 'combat') {
    @if (activeCard(); as active) {
      <bol-action-bar
        [card]="active"
        [armes]="armes()"
        [combatOptions]="combatOptions()"
        (choiceChanged)="choiceChanged.emit($event)"
        (totalDefenseRequested)="totalDefenseRequested.emit()"
        (endTurnRequested)="endTurnRequested.emit()"
      />
    } @else {
      <p class="tps-nobody">Plus personne ne peut jouer.</p>
    }
  }
</ng-template>

<ng-template #rowTpl let-cards="cards" let-labelId="labelId" let-empty="empty" let-scrollerLabel="scrollerLabel">
  <dw-scroller class="tps-scroller" [label]="scrollerLabel">
  <ul class="tps-cards" role="list" [attr.aria-labelledby]="labelId">
    @for (card of cards; track card.key) {
      <li class="tps-slot">
        @if (card.key === expandedKey()) {
          <bol-expanded-card
            [card]="card"
            [sessionId]="sessionId()"
            [hero]="hero()"
            [statblock]="statblock()"
            [returnUrl]="returnUrl()"
            [mode]="mode()"
            [canAttack]="canAttack(card)"
            (closed)="closed.emit()"
            (changed)="changed.emit()"
            (removeRequested)="removeRequested.emit($event)"
            (campToggleRequested)="campToggleRequested.emit($event)"
            (armureToggled)="armureToggled.emit({card, armureId: $event})"
            (armeToggled)="armeToggled.emit({card, armeId: $event})"
            (attackRequested)="attackRequested.emit($event)"
          />
        } @else {
          <bol-character-card
            [card]="card"
            [combat]="stateOf(card)"
            (toggled)="onFaceClick(card)"
            (expandRequested)="cardToggled.emit(card)"
          />
        }
      </li>
    } @empty {
      <li class="tps-empty">{{ empty }}</li>
    }
  </ul>
  </dw-scroller>
</ng-template>
