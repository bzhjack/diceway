<div class="chc-wrap">
  <button
    type="button"
    [id]="'chc-' + card().key"
    [class]="'chc chc--medaillon chc--' + card().kind"
    [class.chc--selected]="selected()"
    [attr.aria-pressed]="selected() ? 'true' : null"
    aria-expanded="false"
    [attr.aria-label]="ariaLabel()"
    (click)="toggled.emit($event)"
  >
    @if (card().badge; as badge) {
      <span class="chc-badge">{{ badge }}</span>
    }
    <span class="chc-art">
      @if (hasAvatar()) {
        <img class="chc-avatar" [src]="card().avatar" alt="" (error)="onAvatarError()" />
      } @else if (kindIconIsSvg()) {
        <mat-icon [svgIcon]="kindIcon()" />
      } @else {
        <mat-icon>{{ kindIcon() }}</mat-icon>
      }
    </span>

    <span class="chc-name"><span class="chc-name-text">{{ card().nom }}</span></span>

    <span class="chc-stats">
      <span class="chc-stat chc-stat--degats"><small>Dég.</small>{{ card().degats }}</span>
      <span class="chc-stat chc-stat--defense"><small>Déf.</small>{{ card().defense }}</span>
      <span class="chc-stat chc-stat--vitalite" [class.chc-stat--long]="vitalite().length > 5"><small>Vit.</small>{{ vitalite() }}</span>
    </span>

    <span class="chc-bar"><i [class.chc-bar-fill--low]="low()" class="chc-bar-fill" [style.width.%]="percent()"></i></span>
  </button>

</div>
