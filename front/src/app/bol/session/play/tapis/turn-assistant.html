<div class="tas" role="group" [attr.aria-label]="'Tour de ' + card().nom" [class.tas--foe]="turn.side().foe">
  <!-- Le registre du tour : la ligne de qui attaque, puis une ligne par étape — l'attaque, les dégâts. Dans chaque ligne, la formule du jet
       reste à l'écran ; les actions sont en bout de ligne ; la ligne où il faut agir s'allume. -->
  <!-- Qui joue : une seule ligne, lue de gauche à droite, sans popover pour préparer le coup. Son nom, sa vie et ses points ; ses chiffres, qui
       suivent les réglages, et ce que dit le MJ ; sa posture et sa manœuvre ; ses armes ; en bout de ligne, sa fiche, ses effets, ce qu'il
       peut faire au lieu d'attaquer et « Fin du tour ». Ce qui ne le concerne pas ne s'affiche pas. Le coup joué reste écrit jusqu'à la fin du tour. -->
  <bol-tas-attaquant />

  <!-- Trois colonnes : la cible, l'attaque, les dégâts. Avant de viser, les cartes des cibles prennent toute la largeur. -->
  <div class="tas-trois" [class.tas-trois--choix]="flow.choixCible()">
  <!-- La cible : avant de viser, une carte par cible sur une ligne (un clic la choisit) ; choisie, il ne reste que sa carte, portrait à gauche,
       avec ses chiffres, sa vie réglable, ses effets, sa fiche, et « Changer d’adversaire » qui ramène la rangée. Le coup joué reste écrit,
       figé, jusqu'à la fin du tour. -->
  <section bol-tas-cible class="tas-contre" aria-label="La cible" [class.tas-off]="loadout.defenseTotale()" [attr.inert]="loadout.defenseTotale() ? '' : null"></section>

  <ol class="tas-reg">
    <!-- 1 · L'attaque : ce qu'il faut et les chances ; la case (tapée à table, ou lancée à l'écran) et les dés, la formule dessous ; le
         verdict ; en bout de ligne, ce que l'attaquant peut payer de ses points. Les options d'un succès héroïque passent dessous. -->
    @if (loadout.sortMode()) {
      <!-- 1 · Le sort, à la place de l'attaque : le coût, le jet (2d6 + esprit + sorcier ± difficulté), le verdict -->
      <li bol-tas-sort [class]="'tas-line tas-line--' + flow.stations()[1] + (attack.sortVerdict() ? ' tas-line--' + attack.sortVerdict()?.tone : '')" aria-labelledby="tas-l2"></li>
    } @else {
      <li bol-tas-attaque [class]="'tas-line tas-line--' + flow.stations()[1] + (flow.attackTone() ? ' tas-line--' + flow.attackTone() : '')" aria-labelledby="tas-l2"></li>
    }

    <!-- 2 · Les dégâts, une fois le jet d'attaque fait : la case et le dé, la formule dessous ; ce que le coup fera à la cible ; en bout de ligne, ce que la
         cible peut y opposer (de ses points, son portrait sur le bouton) et « Appliquer ». Puis l'égratignure, le Carnage ou la fin du tour. -->
    @if (flow.degatsVisibles()) {
      <li bol-tas-degats [class]="'tas-line tas-line--' + flow.stations()[2]" aria-labelledby="tas-l3"></li>
    }
  </ol>
  </div>
</div>
