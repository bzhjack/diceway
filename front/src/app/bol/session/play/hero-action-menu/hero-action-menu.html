<button
  type="button"
  class="ham-btn ham-btn--roll"
  [attr.aria-label]="'Jet d\'action pour ' + heroName()"
  (click)="$event.stopPropagation(); actionRoll.emit()"
>
  <mat-icon>casino</mat-icon>
</button>

<button
  type="button"
  class="ham-btn ham-btn--stats"
  [attr.aria-label]="'Ajuster les stats de ' + heroName()"
  (click)="$event.stopPropagation(); adjustStats.emit()"
>
  <mat-icon>tune</mat-icon>
</button>
