<div class="flex flex-col gap-2">
  @for (carriere of carrieres(); track carriere.id; let index = $index) {
    <dw-collapsible-row
      [expanded]="isExpanded(carriere)"
      [ariaLabel]="'Carrière : ' + carriere.label"
      [label]="carriere.label"
      [labelGrows]="true"
      [stat]="'Rang ' + carriere.rank.value"
      (toggled)="toggle(carriere)"
    >
      <ng-container row-body>
        @if (carriere.description) {
          <p class="dw-entry-meta">{{ carriere.description }}</p>
        }

        <div class="cl-rank-row">
          <span class="dw-entry-detail-title">Rang de carrière</span>
          <dw-value-stepper [formControl]="carriere.rank" [min]="0" ariaLabel="Rang de carrière" />
        </div>

        <button mat-button type="button" class="dw-entry-delete-btn" (click)="removed.emit(index)">
          <mat-icon>delete</mat-icon> Supprimer
        </button>
      </ng-container>
    </dw-collapsible-row>
  } @empty {
    <p class="dw-entry-empty">
      Ajoute les carrières qui résument le parcours du héros.
    </p>
  }
</div>
