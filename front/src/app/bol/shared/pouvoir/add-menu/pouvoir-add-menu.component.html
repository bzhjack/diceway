<button
  type="button"
  class="dw-add-trigger"
  aria-label="Ajouter un pouvoir"
  matTooltip="Ajouter un pouvoir"
  #trigger="matMenuTrigger"
  [matMenuTriggerFor]="menu"
  (menuOpened)="reset()"
>
  <mat-icon>add</mat-icon>
</button>

<mat-menu #menu="matMenu" class="pwam-panel">
  <div class="pwam-content" (click)="$event.stopPropagation()">
    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Pouvoir</mat-label>
      <mat-select [formControl]="selectedId">
        <mat-option [value]="null">— Aucun —</mat-option>
        @for (pouvoir of pouvoirs(); track pouvoir.id) {
          <mat-option [value]="pouvoir.id">{{ pouvoir.pouvoir }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Détail (optionnel)</mat-label>
      <input matInput [formControl]="detailControl" />
    </mat-form-field>

    <button mat-flat-button type="button" [disabled]="!selectedId.value" (click)="add(); trigger.closeMenu()">
      <mat-icon>add</mat-icon> Ajouter le pouvoir
    </button>
  </div>
</mat-menu>
