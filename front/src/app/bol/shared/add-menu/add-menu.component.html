<button
  type="button"
  class="dw-add-trigger"
  [attr.aria-label]="triggerLabel()"
  [matTooltip]="triggerLabel()"
  #trigger="matMenuTrigger"
  [matMenuTriggerFor]="menu"
  (click)="noteOpening($event)"
  (menuOpened)="onMenuOpened()"
>
  <mat-icon>add</mat-icon>
</button>

<mat-menu #menu="matMenu" class="dw-add-menu-panel">
  <!-- Ce conteneur n'est pas une commande (role="presentation") : il garde le menu ouvert. Un clic dans le contenu fermerait le menu, et
       Tab aussi (mat-menu se ferme sur Tab) : Tab circule entre les champs et le bouton (cdkTrapFocus), Échap ferme. -->
  <div
    class="dw-add-menu-content"
    role="presentation"
    cdkTrapFocus
    (click)="$event.stopPropagation()"
    (keydown)="keepOpenOnTab($event)"
  >
    <mat-form-field subscriptSizing="dynamic">
      <mat-label>{{ label() }}</mat-label>
      <mat-select [formField]="selectedField">
        <mat-option [value]="null">{{ emptyLabel() }}</mat-option>
        @for (option of options(); track option.id) {
          <mat-option [value]="option.id">
            <span class="truncate">{{ option.label }}</span>
            @if (option.detail) {
              <span class="dw-add-menu-option-detail">{{ option.detail }}</span>
            }
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (withDetail()) {
      <mat-form-field subscriptSizing="dynamic">
        <mat-label>Détail (optionnel)</mat-label>
        <input matInput [formField]="detailField" />
      </mat-form-field>
    }

    <button mat-flat-button type="button" [disabled]="!selectedId()" (click)="add(); trigger.closeMenu()">
      <mat-icon>add</mat-icon> {{ addLabel() }}
    </button>
  </div>
</mat-menu>
