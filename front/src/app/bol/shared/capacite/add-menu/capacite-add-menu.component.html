<button
  type="button"
  class="dw-add-trigger"
  aria-label="Ajouter une capacité"
  matTooltip="Ajouter une capacité"
  #trigger="matMenuTrigger"
  [matMenuTriggerFor]="menu"
  (menuOpened)="reset()"
>
  <mat-icon>add</mat-icon>
</button>

<mat-menu #menu="matMenu" class="cpam-panel">
  <div class="cpam-content" (click)="$event.stopPropagation()">
    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Capacité</mat-label>
      <mat-select [formControl]="selectedId">
        <mat-option [value]="null">— Aucune —</mat-option>
        @for (capacite of capacites(); track capacite.id) {
          <mat-option [value]="capacite.id">{{ capacite.capacite }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Détail (optionnel)</mat-label>
      <input matInput [formControl]="detailControl" />
    </mat-form-field>

    <button mat-flat-button type="button" [disabled]="!selectedId.value" (click)="add(); trigger.closeMenu()">
      <mat-icon>add</mat-icon> Ajouter la capacité
    </button>
  </div>
</mat-menu>
