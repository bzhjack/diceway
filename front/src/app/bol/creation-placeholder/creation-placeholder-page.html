<section
  class="dw-page"
>
  <div class="mx-auto flex max-w-4xl flex-col gap-4">
    <mat-card appearance="outlined">
      <mat-card-content>
        <div class="flex flex-col gap-6">
          <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
            <div class="space-y-3">
              <div class="flex items-center gap-3">
                <div
                  class="flex h-14 w-14 items-center justify-center border border-[#424b57] bg-[#2563eb] text-2xl text-white"
                >
                  <mat-icon aria-hidden="true">{{ entity().icon }}</mat-icon>
                </div>
                <div class="space-y-1">
                  <p class="m-0 text-xs font-black uppercase tracking-[0.22em] text-sky-300">
                    Création
                  </p>
                  <h1 class="m-0 font-['Muse_Display_Harmony'] text-4xl leading-none">
                    {{ pageTitle() }}
                  </h1>
                </div>
              </div>

              <p class="m-0 max-w-2xl text-sm leading-7 text-slate-300">
                {{ entity().helper }}
              </p>
            </div>

            <div class="flex flex-wrap gap-2">
              <dw-tag>Placeholder</dw-tag>
              <dw-tag>Route prête</dw-tag>
            </div>
          </div>

          <div class="dw-section--form">
            <p class="m-0 text-base leading-8 text-slate-100">
              Le dashboard pointe déjà vers une vraie route de création. On peut maintenant brancher
              cette page à un vrai formulaire selon l entité à traiter.
            </p>
          </div>

          <div class="flex flex-col gap-3 sm:flex-row">
            <button mat-stroked-button routerLink="/">
              <mat-icon>arrow_back</mat-icon> Retour au dashboard
            </button>
            <button mat-flat-button routerLink="/session/live">
              <mat-icon>play_circle_filled</mat-icon> Entrer dans la session live
            </button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</section>
