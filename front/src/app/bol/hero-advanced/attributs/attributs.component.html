<div class="space-y-4">
  <div class="grid gap-4">
    <div class="grid gap-4 sm:grid-cols-2">
      <p-iftalabel>
        <p-inputNumber inputId="advanced-vigueur" class="dw-input-number" inputStyleClass="!text-sm" [formControl]="vigueurCtrl" />
        <label for="advanced-vigueur">Vigueur</label>
      </p-iftalabel>
      <p-iftalabel>
        <p-inputNumber inputId="advanced-agilite" class="dw-input-number" inputStyleClass="!text-sm" [formControl]="agiliteCtrl" />
        <label for="advanced-agilite">Agilité</label>
      </p-iftalabel>
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <p-iftalabel>
        <p-inputNumber inputId="advanced-esprit" class="dw-input-number" inputStyleClass="!text-sm" [formControl]="espritCtrl" />
        <label for="advanced-esprit">Esprit</label>
      </p-iftalabel>
      <p-iftalabel>
        <p-inputNumber inputId="advanced-aura" class="dw-input-number" inputStyleClass="!text-sm" [formControl]="auraCtrl" />
        <label for="advanced-aura">Aura</label>
      </p-iftalabel>
    </div>
  </div>

  @if (attributErrors().length) {
    <div class="border border-red-400/35 bg-red-950/20 p-3 text-sm text-red-200">
      @for (error of attributErrors(); track error.control + error.error) {
        <p class="m-0">{{ error.control ? error.control + ' ' : '' }}{{ error.error }}</p>
      }
    </div>
  } @else if (attributWarns().length) {
    <div class="border border-amber-400/30 bg-amber-950/15 p-3 text-sm text-amber-200">
      @for (warning of attributWarns(); track warning.warn) {
        <p class="m-0">{{ warning.warn }}</p>
      }
    </div>
  }
</div>
