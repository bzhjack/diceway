<section class="dw-page">
  <div class="mx-auto flex max-w-7xl flex-col gap-4">
    <mat-card appearance="outlined">
      <mat-card-content>
        <form class="dw-creation-form" (submit)="onFormSubmit($event)">
          <dw-form-header icon="gi-masks" [eyebrow]="pageEyebrow()" [title]="pageTitle()">
            <button mat-stroked-button type="button" [disabled]="pending()" (click)="goBack()">
              <mat-icon svgIcon="gi-return" /> Retour
            </button>

            <button
              mat-flat-button
              type="submit"
              [disabled]="pending() || loading() || pnjForm().invalid()"
            >
              <mat-icon svgIcon="gi-check" /> {{ submitLabel() }}
              @if (formDirty()) {
                <span class="dw-dirty-dot" aria-label="Modifications non enregistrées"></span>
              }
            </button>
          </dw-form-header>

          <div class="grid gap-4">
            @if (loading()) {
              <div class="dw-section--loading">
                <p class="dw-section-eyebrow">
                  Chargement
                </p>
                <p class="dw-loading-detail">
                  Récupération du PNJ à modifier.
                </p>
              </div>
            }

            <div class="grid gap-4 xl:grid-cols-[260px_minmax(0,1fr)] xl:items-start">
              <div class="dw-section--form dw-rail-panel">
                <bol-summary-rail
                  [avatarPreview]="avatarPreview()"
                  avatarLabel="Changer le portrait du PNJ"
                  [name]="pnjNom()"
                  emptyName="Nouveau PNJ"
                  [tag]="pnjTypeLabel()"
                  [vitalite]="pnjVitalite()"
                  [traits]="selectedTraitEntries()"
                  [avantagesDisponibles]="filteredAvantages()"
                  [desavantagesDisponibles]="filteredDesavantages()"
                  [langues]="selectedLangues()"
                  [languesDisponibles]="filteredLangues()"
                  (avatarClick)="pickAvatar()"
                  (traitAdded)="addTraitEntry($event)"
                  (traitRemoved)="removeTrait($event)"
                  (langueAdded)="addLangueEntry($event)"
                  (langueRemoved)="removeLangue($event)"
                />
              </div>

              <div class="flex min-w-0 flex-col gap-4">
                <div class="grid gap-4 xl:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] xl:items-stretch">
                  <div class="dw-section--form dw-panel--stretch">
                    <bol-pnj-general
                      [form]="pnjForm"
                      [typeOptions]="typeOptions"
                      [showValidationHint]="showGeneralHint()"
                    />
                  </div>

                  <div class="dw-section--form dw-panel--stretch">
                    <bol-list-panel
                      title="Carrières"
                      [count]="selectedCarrieres().length"
                      [options]="carriereOptions()"
                      label="Carrière"
                      triggerLabel="Ajouter une carrière"
                      addLabel="Ajouter la carrière"
                      (added)="addCarriereEntry($event.id)"
                    >
                      <bol-carriere-list [carrieres]="selectedCarrieres()" (removed)="removeCarriere($event)" />
                    </bol-list-panel>
                  </div>
                </div>

                <div class="dw-section--form">
                  <bol-stats-grid [form]="statsForm" [groups]="pnjStatGroups" />
                </div>

                <div class="grid gap-4 xl:grid-cols-2 xl:items-start">
                  <div class="dw-section--form">
                    <bol-list-panel
                      title="Armes"
                      [count]="selectedArmes().length"
                      [options]="armeOptions()"
                      label="Arme"
                      triggerLabel="Ajouter une arme"
                      addLabel="Ajouter l'arme"
                      (added)="addArmeEntry($event.id)"
                    >
                      <!-- Un PNJ a toutes ses armes en main : les cases restent cochées -->
                      <bol-arme-list
                        [armes]="selectedArmes()"
                        [equipToggleEnabled]="false"
                        (removed)="removeArme($event)"
                        [etoiles]="etoilesArmes()"
                        (favoriteToggled)="toggleArmeFavorite($event)"
                      />
                    </bol-list-panel>
                  </div>

                  <div class="dw-section--form">
                    <bol-list-panel
                      title="Armures"
                      [count]="selectedArmures().length"
                      [options]="armureOptions()"
                      label="Armure"
                      triggerLabel="Ajouter une armure"
                      addLabel="Ajouter l'armure"
                      (added)="addArmureEntry($event.id)"
                    >
                      <!-- Un PNJ porte toutes ses armures : les cases restent cochées -->
                      <bol-armure-list
                        [armures]="selectedArmures()"
                        [equipToggleEnabled]="false"
                        (removed)="removeArmure($event)"
                      />
                    </bol-list-panel>
                  </div>
                </div>
              </div>
            </div>

            @if (errorMessage()) {
              <div class="dw-error-box">
                {{ errorMessage() }}
              </div>
            }
          </div>

          <p class="dw-forge-credit">
            Icônes :
            <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a>
            (Lorc, Delapouite et contributeurs),
            <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>
          </p>

        </form>
      </mat-card-content>
    </mat-card>
  </div>
</section>
