<section class="dw-page xl:px-8">
  <div class="mx-auto flex max-w-[1600px] flex-col gap-4">

    <!-- Header card -->
    <dw-library-header
      title="Galerie des PNJ"
      description="Tous les personnages non joueurs disponibles pour préparer une scène, une faction ou une rencontre."
      image="/assets/bol/header-pnj.webp"
    >
      <ng-container dwHeaderTags>
        <dw-tag>{{ totalPnjCount() }} PNJ</dw-tag>
        @if (pnjCount() !== totalPnjCount()) {
          <dw-tag>{{ pnjCount() }} visibles</dw-tag>
        }
      </ng-container>
      <ng-container dwHeaderActions>
        <div class="flex flex-wrap gap-1.5">
          <button
            mat-flat-button
            routerLink="/create/pnj"
            [state]="{ returnUrl: '/library/pnjs' }"
          >
            <mat-icon>add</mat-icon> Créer un PNJ
          </button>
          <button mat-stroked-button routerLink="/library/creatures">
            <mat-icon>pets</mat-icon> Voir les créatures
          </button>
          <button mat-stroked-button routerLink="/library/demons">
            <mat-icon>bolt</mat-icon> Voir les démons
          </button>
        </div>
        <button mat-stroked-button [routerLink]="returnUrl() ?? '/'">
          <mat-icon>arrow_back</mat-icon> {{ returnUrl() ? 'Retour à la table' : "Retour à l'accueil" }}
        </button>
      </ng-container>
    </dw-library-header>

    <!-- Content card -->
    <mat-card appearance="outlined" class="pnj-content-card">

      <!-- Toolbar -->
      <dw-library-toolbar
        placeholder="Rechercher un PNJ"
        [(searchTerm)]="searchTerm"
        [(checked)]="onlyCreations"
        (cleared)="clearFilters()"
      >
        <mat-form-field dwToolbarFilter class="pnj-type-field" subscriptSizing="dynamic">
          <mat-icon matPrefix>filter_list</mat-icon>
          <mat-select
            [formField]="typeField"
          >
            @for (option of typeOptions; track option.value) {
              <mat-option [value]="option.value">{{ option.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <dw-tag dwToolbarCount>{{ pnjCount() }} entrées</dw-tag>
      </dw-library-toolbar>

      <!-- Grille de cartes -->
      <dw-library-grid [empty]="filteredPnjs().length === 0" emptyMessage="Aucun PNJ ne correspond à cette recherche.">
        @for (pnj of filteredPnjs(); track pnj.id) {
          <bol-pnj-card
            [pnj]="pnj"
            (deleteRequested)="askDelete(pnj)"
            (statblockRequested)="openStatblock(pnj)"
          />
        }
      </dw-library-grid>
    </mat-card>

  </div>
</section>
