<div class="flex flex-col gap-2">
  @for (trait of traits(); track trait.type + '-' + trait.id; let index = $index) {
    <dw-collapsible-row
      [tone]="trait.type === 'A' ? 'positive' : 'negative'"
      [expanded]="isExpanded(trait)"
      [ariaLabel]="(trait.type === 'A' ? 'Avantage' : 'Désavantage') + ' : ' + trait.label"
      (toggled)="toggle(trait)"
    >
      <ng-container row-summary>
        <div class="tag_icon tl-trait-icon" [inlineSVG]="traitIconPath(trait.icon)"></div>
        <span class="dw-entry-label truncate">{{ trait.label }}</span>
      </ng-container>

      <ng-container row-body>
        @for (detail of trait.details; track detail.title + detail.description) {
          <div class="dw-entry-meta m-0">
            <div class="dw-entry-detail-title">{{ detail.title }} :</div>
            <div>
            {{ detail.description }}
            </div>
          </div>
        }

        <button mat-button type="button" class="dw-entry-delete-btn" (click)="removed.emit(index)">
          <mat-icon>delete</mat-icon> Supprimer
        </button>
      </ng-container>
    </dw-collapsible-row>
  } @empty {
    <p class="dw-entry-empty m-0">
      Ajoute les avantages et désavantages qui définissent le héros.
    </p>
  }
</div>
