<div class="hs-groups">
  <span class="hs-g hs-g--attr">Attributs</span>
  <span class="hs-g hs-g--combat">Combat</span>
  <span class="hs-g hs-g--res">Ressources</span>
</div>

<div class="hs-grid" [formGroup]="form()">
  @for (cell of cells; track cell.control) {
    <div class="hs-cell hs-cell--{{ cell.group }}">
      <span class="hs-lbl">{{ cell.label }}</span>
      <dw-value-stepper [formControlName]="cell.control" [ariaLabel]="cell.label" />
    </div>
  }
</div>
