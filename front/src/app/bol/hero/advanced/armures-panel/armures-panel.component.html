<bol-list-panel
  title="Armures"
  [count]="armures().length"
  [options]="armureOptions()"
  label="Armure"
  triggerLabel="Ajouter une armure"
  addLabel="Ajouter l'armure"
  (added)="armureAdded.emit($event.id)"
>
  <!-- Région live toujours présente : l'avertissement y apparaît et est annoncé, sans bloquer l'activation. -->
  <div role="status">
    @if (warnHeavy()) {
      <p class="dw-field-warning hap-armures-warning">
        Armure lourde — Vigueur négative : le livre interdit l'armure lourde à ce personnage (p. 52). Vérifiez la
        cohérence avec les règles.
      </p>
    }
  </div>

  <bol-armure-list [armures]="armures()" (equippedToggled)="armureEquippedToggled.emit($event)" (removed)="armureRemoved.emit($event)" />
</bol-list-panel>
