<p class="hap-section-eyebrow">
  Identité
</p>

<div class="mt-3 grid gap-2 md:grid-cols-2">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Nom du joueur</mat-label>
    <input matInput id="advanced-joueur" [formField]="form().joueur" />
  </mat-form-field>

  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Nom du héros</mat-label>
    <input matInput id="advanced-nom" [formField]="form().nom" />
  </mat-form-field>

  <mat-form-field subscriptSizing="dynamic" class="hap-region-field md:col-span-2">
    <mat-label>Région</mat-label>
    <mat-icon matPrefix class="hap-region-icon">map</mat-icon>
    <input
      matInput
      readonly
      class="hap-region-input"
      [value]="region()?.region ?? ''"
      placeholder="Choisir une région…"
      aria-haspopup="dialog"
      (click)="regionPick.emit()"
      (keydown.enter)="$event.preventDefault(); regionPick.emit()"
      (keydown.space)="$event.preventDefault(); regionPick.emit()"
    />
    @if (region()) {
      <button
        type="button"
        mat-icon-button
        matSuffix
        aria-label="Retirer la région"
        (click)="regionClear.emit()"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <div class="md:col-span-2">
    <mat-form-field subscriptSizing="dynamic" class="w-full">
      <mat-label>Commentaire</mat-label>
      <textarea
        matInput
        id="advanced-commentaire"
        [formField]="form().commentaire"
        rows="3"
        class="resize-none"
      ></textarea>
    </mat-form-field>
  </div>
</div>

@if (errors().length) {
  <div class="dw-field-error mt-3 p-3">
    @for (error of errors(); track error.control + error.error) {
      <p class="m-0">{{ error.error }}</p>
    }
  </div>
} @else if (warns().length) {
  <div class="dw-field-warning mt-3 p-3">
    @for (warning of warns(); track warning.warn) {
      <p class="m-0">{{ warning.warn }}</p>
    }
  </div>
}
