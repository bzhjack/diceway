<bol-list-panel
  title="Armes"
  [count]="armes().length"
  [options]="armeOptions()"
  label="Arme"
  triggerLabel="Ajouter une arme"
  addLabel="Ajouter l'arme"
  (added)="armeAdded.emit($event.id)"
>
  <!-- Région live toujours présente : l'avertissement y apparaît et est annoncé, sans bloquer l'activation. -->
  <div role="status">
    @if (warnHeavy()) {
      <p class="dw-field-warning hap-armes-warning">
        Arme lourde (d6B) — Vigueur négative : le personnage ne peut pas la manier (p. 14 et 63).
      </p>
    }
  </div>

  <bol-arme-list
    [armes]="armes()"
    [etoiles]="etoiles()"
    (removed)="armeRemoved.emit($event)"
    (equippedToggled)="armeEquippedToggled.emit($event)"
    (favoriteToggled)="favoriteToggled.emit($event)"
  />
</bol-list-panel>
