<bol-list-panel
  title="Armes"
  [count]="armes().length"
  [options]="armeOptions()"
  label="Arme"
  triggerLabel="Ajouter une arme"
  addLabel="Ajouter l'arme"
  (added)="armeAdded.emit($event.id)"
>
  @if (warnHeavy()) {
    <div class="dw-field-warning mb-3">
      Arme lourde (d6B) — Vigueur négative : le personnage subit un malus au combat. Vérifiez la
      cohérence avec les règles.
    </div>
  }

  <bol-arme-list
    [armes]="armes()"
    [etoiles]="etoiles()"
    (removed)="armeRemoved.emit($event)"
    (equippedToggled)="armeEquippedToggled.emit($event)"
    (favoriteToggled)="favoriteToggled.emit($event)"
  />
</bol-list-panel>
