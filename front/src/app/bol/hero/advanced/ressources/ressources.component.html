<div class="grid gap-3">
  @for (entry of displayResources(); track entry.label) {
    <div class="dwr-row flex items-center justify-between px-3 py-2">
      <span class="dwr-label">{{ entry.label }}</span>
      <span class="dwr-value">{{ entry.value }}</span>
    </div>
  }

  @if (heroismCost() > 0) {
    <div class="dw-field-warning p-3">
      Coût d'héroïsme en attente : {{ heroismCost() }}
    </div>
  }
</div>
