<section class="dw-page xl:px-8">
  <div class="mx-auto flex max-w-[1600px] flex-col gap-4">

    <!-- Header card -->
    <dw-library-header
      title="Galerie des héros"
      description="Vue d'ensemble des héros de Lémurie, avec leur profil, leur équipement et leurs traits."
      image="/assets/bol/header-heros.webp"
    >
      <ng-container dwHeaderTags>
        <dw-tag>{{ totalHeroCount() }} héros</dw-tag>
        @if (heroCount() !== totalHeroCount()) {
          <dw-tag>{{ heroCount() }} visibles</dw-tag>
        }
      </ng-container>
      <ng-container dwHeaderActions>
        <div class="flex flex-wrap gap-1.5">
          <button
            mat-flat-button
            routerLink="/create/hero"
            [state]="{ returnUrl: '/library/heroes' }"
          >
            <mat-icon>add</mat-icon> Créer un héros
          </button>
          <button
            mat-stroked-button
            routerLink="/create/hero-advanced"
            [state]="{ returnUrl: '/library/heroes' }"
          >
            <mat-icon>star</mat-icon> Création avancée
          </button>
          <button mat-stroked-button routerLink="/library/pnjs">
            <mat-icon>manage_accounts</mat-icon> Voir les PNJ
          </button>
          <button mat-stroked-button routerLink="/library/creatures">
            <mat-icon>pets</mat-icon> Voir le bestiaire
          </button>
        </div>
        <button mat-stroked-button [routerLink]="returnUrl() ?? '/'">
          <mat-icon>arrow_back</mat-icon> {{ returnUrl() ? 'Retour à la table' : "Retour à l'accueil" }}
        </button>
      </ng-container>
    </dw-library-header>

    <!-- Content card -->
    <mat-card appearance="outlined" class="hero-content-card">

      <!-- Toolbar -->
      <dw-library-toolbar
        placeholder="Rechercher un héros"
        checkboxLabel="En cours de création"
        [(searchTerm)]="searchTerm"
        [(checked)]="onlyPending"
        (cleared)="clearFilters()"
      >
        <dw-tag dwToolbarCount>{{ heroCount() }} entrées</dw-tag>
      </dw-library-toolbar>

      <!-- Grille de cartes -->
      <dw-library-grid [empty]="filteredHeroes().length === 0" emptyMessage="Aucun héros ne correspond à cette recherche.">
        @for (hero of filteredHeroes(); track hero.id) {
          <bol-hero-card
            [hero]="hero"
            (deleteRequested)="askDelete(hero)"
            (statblockRequested)="openStatblock(hero)"
          />
        }
      </dw-library-grid>
    </mat-card>

  </div>
</section>
