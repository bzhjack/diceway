<section class="dw-page dw-forge-page">
  <div class="mx-auto flex max-w-6xl flex-col gap-4">
    <mat-card appearance="outlined">
      <mat-card-content>
        <form class="dw-creation-form flex flex-col gap-6" (submit)="onFormSubmit($event)">
          <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
            <div class="space-y-3">
              <div class="flex items-center gap-3">
                <div class="cfp-icon">
                  <mat-icon svgIcon="gi-paw" />
                </div>
                <div class="space-y-1">
                  <p class="cfp-eyebrow">
                    {{ pageEyebrow() }}
                  </p>
                  <h1 class="cfp-title">
                    {{ pageTitle() }}
                  </h1>
                </div>
              </div>
            </div>

            <div class="flex flex-col gap-3 sm:flex-row md:justify-end">
              <button mat-stroked-button type="button" [disabled]="pending()" (click)="goBack()">
                <mat-icon svgIcon="gi-return" />
                {{ returnUrl() === '/library/creatures' ? 'Retour à la bibliothèque' : 'Retour' }}
              </button>

              <button
                mat-flat-button
                type="submit"
                [disabled]="pending() || loading() || creatureForm().invalid()"
              >
                <mat-icon svgIcon="gi-check" /> {{ submitLabel() }}
                @if (formDirty()) {
                  <span class="cfp-dirty-dot" aria-label="Modifications non enregistrées"></span>
                }
              </button>
            </div>
          </div>

          <div class="grid gap-4">
            @if (loading()) {
              <div class="dw-section--loading">
                <p class="cfp-section-eyebrow">
                  Chargement
                </p>
                <p class="cfp-loading-detail">
                  Récupération de la créature à modifier.
                </p>
              </div>
            }

            <div class="grid gap-4 xl:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] xl:items-stretch">
              <div class="dw-section--form xl:h-full">
                <bol-creature-general
                  [form]="creatureForm"
                  [tailles]="tailles()"
                  [compareById]="compareById"
                  [avatarPreview]="avatarPreview()"
                  [showValidationHint]="showGeneralHint()"
                  (avatarClick)="pickAvatar()"
                />
              </div>

              <div class="dw-section--form xl:h-full">
                <bol-creature-capacites
                  [capacites]="selectedCapaciteEntries()"
                  [capacitesDisponibles]="filteredCapacites()"
                  (added)="addCapaciteEntry($event)"
                  (removed)="removeCapacite($event)"
                />
              </div>
            </div>

            <div class="dw-section--form">
              <bol-stats-grid [form]="statsForm" [groups]="creatureStatGroups" />
            </div>

            @if (errorMessage()) {
              <div class="cfp-error-box">
                {{ errorMessage() }}
              </div>
            }
          </div>

          <p class="dw-forge-credit">
            Icônes :
            <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a>
            (Lorc, Delapouite et contributeurs),
            <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>
          </p>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</section>
