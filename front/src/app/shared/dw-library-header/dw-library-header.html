<mat-card appearance="outlined">
  <mat-card-content>
    <div class="flex flex-col gap-4">
      <div class="space-y-2.5">
        <div class="space-y-1.5">
          <p class="dw-lh-eyebrow m-0 text-xs font-black uppercase tracking-[0.22em]">
            {{ kicker() }}
          </p>
          <h1 class="m-0 font-['Muse_Display_Harmony'] text-4xl leading-none md:text-[2.8rem]">
            {{ title() }}
          </h1>
        </div>
        @if (description()) {
          <p class="m-0 max-w-3xl text-sm leading-6 text-slate-300 md:text-[0.95rem]">
            {{ description() }}
          </p>
        }
        <div class="flex flex-wrap gap-1.5">
          <ng-content select="[dwHeaderTags]" />
        </div>
      </div>
      <div class="library-header-actions flex flex-wrap items-center justify-between gap-1.5">
        <ng-content select="[dwHeaderActions]" />
      </div>
    </div>
  </mat-card-content>
</mat-card>
