<!-- Chaque zone projetée n'a qu'un emplacement (la projection se décide à la compilation, pas dans un @if) : la variante compacte ne
     change que la disposition, par sa classe. -->
<mat-card
  appearance="outlined"
  class="dw-lh-card"
  [class.dw-lh-card--image]="!!backgroundImage()"
  [class.dw-lh-card--compact]="compact()"
  [style.background-image]="backgroundImage()"
>
  <mat-card-content>
    <div class="dw-lh-corps">
      <div class="dw-lh-entete">
        <p class="dw-lh-eyebrow">Bibliothèque BOL</p>
        <h1 class="dw-lh-title">{{ title() }}</h1>
        @if (description() && !compact()) {
          <p class="dw-lh-description">{{ description() }}</p>
        }
      </div>
      <div class="dw-lh-tags">
        <ng-content select="[dwHeaderTags]" />
      </div>
      <div class="library-header-actions">
        <ng-content select="[dwHeaderActions]" />
      </div>
    </div>
  </mat-card-content>
</mat-card>
