@if (expandable()) {
  <div
    class="dw-row-toggle flex w-full min-w-0 items-center gap-2"
    role="button"
    tabindex="0"
    [attr.aria-expanded]="expanded()"
    [attr.aria-label]="ariaLabel()"
    (click)="toggled.emit()"
    (keydown.enter)="toggled.emit()"
    (keydown.space)="onSpace($event)"
  >
    <mat-icon class="dw-row-chevron">chevron_right</mat-icon>
    @if (label()) {
      <span class="dw-row-label" [class.dw-row-label--grow]="labelGrows()">{{ label() }}</span>
    }
    <ng-content select="[row-summary]" />
    @if (stat()) {
      <span class="dw-row-stat">{{ stat() }}</span>
    }
  </div>

  @if (expanded()) {
    <div class="dw-row-body">
      <ng-content select="[row-body]" />
    </div>
  }
} @else {
  <div class="dw-row-summary flex w-full min-w-0 items-center gap-2">
    @if (label()) {
      <span class="dw-row-label" [class.dw-row-label--grow]="labelGrows()">{{ label() }}</span>
    }
    <ng-content select="[row-summary]" />
    @if (stat()) {
      <span class="dw-row-stat">{{ stat() }}</span>
    }
  </div>
}
