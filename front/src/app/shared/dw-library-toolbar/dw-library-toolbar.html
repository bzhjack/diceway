<div class="dw-lt-toolbar">
  <div class="dw-lt-controls">
    <mat-form-field class="dw-lt-search-field" subscriptSizing="dynamic">
      <mat-icon matPrefix svgIcon="gi-search" />
      <input
        matInput
        type="text"
        [formField]="searchField"
        [placeholder]="placeholder()"
      />
    </mat-form-field>

    <ng-content select="[dwToolbarFilter]" />

    @if (withFilters()) {
      <div class="dw-lt-filter-chip">
        <mat-checkbox [formField]="checkedField">
          {{ checkboxLabel() }}
        </mat-checkbox>
      </div>

      <button mat-stroked-button (click)="clear()">
        <mat-icon>filter_alt_off</mat-icon> Effacer
      </button>
    }
  </div>

  <ng-content select="[dwToolbarCount]" />
</div>
