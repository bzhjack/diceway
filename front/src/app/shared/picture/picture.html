<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <div class="flex flex-col gap-4 p-2">
    <div class="flex w-full items-center justify-between gap-3">
      @if (imageChangedEvent) {
        <button mat-stroked-button size="small" (click)="file.click()">
          <mat-icon>upload</mat-icon> Importer une image
        </button>

        <div class="flex gap-2">
          <button mat-icon-button (click)="zoomIn()" aria-label="Zoom avant">
            <mat-icon>zoom_in</mat-icon>
          </button>
          <button mat-icon-button (click)="zoomOut()" aria-label="Zoom arrière">
            <mat-icon>zoom_out</mat-icon>
          </button>
          <button mat-icon-button (click)="resetImage()" aria-label="Réinitialiser">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      }

      <input
        #file
        id="importFile"
        type="file"
        accept="image/*"
        class="hidden"
        (change)="fileChangeEvent($event)"
      />
    </div>

    @if (imageChangedEvent) {
      <div class="picture-body">
        <div class="cropper-shell">
          <image-cropper
            [transform]="transform"
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="true"
            [aspectRatio]="1 / 1"
            [backgroundColor]="'#111827'"
            format="png"
            output="base64"
            [resizeToWidth]="256"
            [cropperMinWidth]="128"
            (loadImageFailed)="loadImageFailed()"
            (imageCropped)="imageCropped($event)"
          />
        </div>

        <div class="preview-shell">
          @if (croppedImage) {
            <img [src]="croppedImage" alt="Aperçu avatar" class="preview-image" />
          } @else {
            <div class="preview-placeholder">Aperçu</div>
          }
        </div>
      </div>
    } @else {
      <div
        class="picture-dropzone"
        dwDragDropFile
        (filesDropped)="dropFileEvent($event)"
      >
        <mat-icon class="picture-dropzone-icon">upload</mat-icon>
        <div class="pt-4 picture-dropzone-text">
          Dépose l'image ici, ou
          <button type="button" class="ml-1 picture-dropzone-link" (click)="file.click()">
            sélectionne un fichier
          </button>
        </div>
      </div>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="quit()">
    <mat-icon>close</mat-icon> Quitter
  </button>
  <button mat-flat-button [disabled]="!croppedImage" (click)="validate()">
    <mat-icon>check</mat-icon> Valider
  </button>
</mat-dialog-actions>
