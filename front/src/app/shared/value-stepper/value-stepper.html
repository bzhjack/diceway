<div class="vs" [attr.aria-label]="ariaLabel()">
  <button
    type="button"
    class="vs__btn"
    (click)="decrement()"
    [disabled]="disabled() || isMin()"
    aria-label="Diminuer"
  >
    −
  </button>
  <input
    class="vs__value"
    type="number"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    (change)="onInput($event)"
  />
  <button
    type="button"
    class="vs__btn"
    (click)="increment()"
    [disabled]="disabled() || isMax()"
    aria-label="Augmenter"
  >
    +
  </button>
</div>
