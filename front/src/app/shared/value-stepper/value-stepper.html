<div class="vs" [attr.aria-label]="ariaLabel()">
  <button
    type="button"
    class="vs__btn"
    (click)="decrement()"
    [disabled]="disabled() || isMin()"
    aria-label="Diminuer"
  >
    −
  </button>
  <span class="vs__field" [class.vs__field--heart]="heart()">
    <input
      class="vs__value"
      type="number"
      [value]="value()"
      [disabled]="disabled()"
      [attr.aria-label]="ariaLabel()"
      (change)="onInput($event)"
      (keydown.enter)="onEnterKey($event)"
    />
  </span>
  <button
    type="button"
    class="vs__btn"
    (click)="increment()"
    [disabled]="disabled() || isMax()"
    aria-label="Augmenter"
  >
    +
  </button>
</div>
