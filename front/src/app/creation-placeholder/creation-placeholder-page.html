<section
  class="min-h-dvh bg-[radial-gradient(circle_at_top_left,_rgba(96,165,250,0.12),_transparent_28%),linear-gradient(180deg,_#000000,_#0f172a_45%,_#000000)] px-4 py-6 md:px-6"
>
  <div class="mx-auto flex max-w-4xl flex-col gap-4">
    <p-card
      styleClass="!border !border-[#2d3748] !bg-[#1a202c]/96 !text-slate-50 !shadow-[0_24px_60px_rgba(0,0,0,0.28)]"
    >
      <div class="flex flex-col gap-6">
        <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
          <div class="space-y-3">
            <div class="flex items-center gap-3">
              <div
                class="flex h-14 w-14 items-center justify-center border border-[#424b57] bg-[#2563eb] text-2xl text-white"
              >
                <i [class]="entity().icon" aria-hidden="true"></i>
              </div>
              <div class="space-y-1">
                <p class="m-0 text-xs font-black uppercase tracking-[0.22em] text-sky-300">
                  Création
                </p>
                <h1 class="m-0 font-['Muse_Display_Harmony'] text-4xl leading-none">
                  Nouvelle {{ entity().label }}
                </h1>
              </div>
            </div>

            <p class="m-0 max-w-2xl text-sm leading-7 text-slate-300">
              {{ entity().helper }}
            </p>
          </div>

          <div class="flex flex-wrap gap-2">
            <p-tag value="Placeholder" severity="warn" />
            <p-tag value="Route prête" severity="success" />
          </div>
        </div>

        <div class="border border-[#424b57] bg-[#334155]/55 p-5">
          <p class="m-0 text-base leading-8 text-slate-100">
            Le dashboard pointe déjà vers une vraie route de création. On peut maintenant brancher
            cette page à un vrai formulaire PrimeNG selon l entité à traiter.
          </p>
        </div>

        <div class="flex flex-col gap-3 sm:flex-row">
          <p-button
            label="Retour au dashboard"
            icon="pi pi-arrow-left"
            [routerLink]="'/'"
            severity="secondary"
            [outlined]="true"
            styleClass="!px-5 !py-3 !font-bold"
          />
          <p-button
            label="Entrer dans la session live"
            icon="pi pi-play-circle"
            [routerLink]="'/session/live'"
            styleClass="!bg-[#2563eb] !border-[#2563eb] !text-white !px-5 !py-3 !font-bold"
          />
        </div>
      </div>
    </p-card>
  </div>
</section>
