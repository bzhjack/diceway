<app-auth-card [title]="title" [titleDanger]="forbidden" subtitle="Cliquez sur le lien de confirmation reçu par email lors de votre inscription. Si vous ne le retrouvez pas, entrez votre adresse ci-dessous pour en recevoir un nouveau.">
  <form class="auth-mat-form" (submit)="onSubmit($event)">
    <mat-form-field>
      <mat-label>Adresse mail</mat-label>
      <mat-icon matPrefix>mail</mat-icon>
      <input matInput type="email" [formField]="resendForm.email" autocomplete="username" />
      <mat-error>{{ resendForm.email().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <dw-error-message [messages]="messages()" />

    @if (successMessage()) {
      <div class="auth-mat-success" role="status">{{ successMessage() }}</div>
    }

    <app-auth-actions [pending]="pending()" submitLabel="Envoyer" />
  </form>

  <ng-container authFooter>
    Vous vous souvenez de votre mot de passe ? <a routerLink="/login">Se connecter</a>
  </ng-container>
</app-auth-card>
