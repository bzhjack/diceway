<section class="auth-mat-page">
  <mat-card class="auth-mat-card" appearance="outlined">
    <img mat-card-image ngSrc="assets/dw1.jpg" alt="" width="400" height="265" priority />

    <mat-card-header>
      <mat-card-title>Diceway</mat-card-title>
      <mat-card-subtitle>Connectez-vous pour rejoindre l'aventure</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" class="auth-mat-form" (ngSubmit)="login()">
        <mat-form-field>
          <mat-label>Adresse mail</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          <mat-error>Adresse mail non valide</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Mot de passe</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-error>Minimum 8 caractères</mat-error>
        </mat-form-field>

        <dw-error-message [messages]="messages" />

        <div class="auth-mat-actions">
          <a routerLink="/forgotten" class="login-link-muted">Mot de passe oublié ?</a>
          <button mat-flat-button type="submit" [disabled]="pending || loginForm.invalid">
            @if (pending) {
              <mat-progress-spinner mode="indeterminate" diameter="18" />
            } @else {
              Connexion
            }
          </button>
        </div>
      </form>

      <div class="login-divider" role="separator" aria-label="ou">
        <span>ou</span>
      </div>

      <button mat-stroked-button type="button" class="login-google-btn" [disabled]="pending" (click)="loginWithGoogle()">
        <span class="login-google-btn__content">
          <img ngSrc="assets/socialite/google.svg" alt="" width="18" height="18" aria-hidden="true" />
          Continuer avec Google
        </span>
      </button>
    </mat-card-content>

    <mat-card-actions>
      <span class="auth-mat-footer">
        Pas encore de compte ? <a routerLink="/register">Inscrivez-vous</a>
      </span>
    </mat-card-actions>
  </mat-card>
</section>
