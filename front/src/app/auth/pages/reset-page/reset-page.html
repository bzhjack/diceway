<section class="auth-page">
  <div class="flex flex-col h-screen items-center gap-1 pt-10">
    <img ngSrc="assets/dw1.jpg" alt="" width="400" height="265" priority />
    <div class="text-xl">Nouveau mot de passe</div>
    <form [formGroup]="resetForm" class="flex flex-col gap-2 w-1/4" (ngSubmit)="reset()">
      <div class="relative flex flex-col">
        <input class="p-inputtext-sm" type="password" formControlName="password" pInputText placeholder="Mot de passe*" autocomplete="new-password" />
        @if (onError('password')) {
          <p-message severity="error" size="small" variant="simple">Minimum 8 caractères</p-message>
        }
      </div>
      <div class="relative flex flex-col">
        <input class="p-inputtext-sm" type="password" formControlName="password_confirmation" pInputText placeholder="Confirmer le mot de passe*" autocomplete="new-password" />
        @if (onError('password_confirmation') || resetForm.hasError('passwordMismatch')) {
          <p-message severity="error" size="small" variant="simple">Ne corresponds pas</p-message>
        }
      </div>
      <div>
        @for (message of messages; track message) {
          <p-message severity="error" [closable]="false">{{ message }}</p-message>
        }
      </div>
      <div class="flex justify-end gap-2">
        <p-button [routerLink]="'/login'" label="retour" size="small" severity="secondary" [disabled]="pending" />
        <p-button label="Valider" size="small" [disabled]="resetForm.invalid || pending" type="submit" />
      </div>
    </form>
  </div>
</section>
