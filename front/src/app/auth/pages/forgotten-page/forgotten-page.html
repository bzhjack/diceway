<section class="auth-page">
  <div class="flex flex-col h-screen items-center w-full gap-1 pt-10">
    <img ngSrc="assets/dw1.jpg" alt="" width="400" height="265" priority />
    <form [formGroup]="forgotForm" class="flex flex-col gap-4 w-1/3" (ngSubmit)="send()">
      <div class="text-xl">
        Renseigner votre adresse mail ci dessous et nous vous everrons une lien pour pouvoir modifier votre mot de
        passe.
      </div>

      <div class="flex flex-col gap-2">
        <div class="relative flex flex-col">
          <p-inputGroup>
            <p-inputGroupAddon>
              <i class="pi pi-user"></i>
            </p-inputGroupAddon>
            <input pInputText formControlName="email" placeholder="Adresse mail" autocomplete="username" />
          </p-inputGroup>
          @if (onError('email')) {
            <small class="dw_error">Adresse mail non valide</small>
          }
        </div>
        <div class="flex justify-end gap-2">
          <p-button [routerLink]="'/login'" label="Retour" size="small" severity="secondary" [disabled]="pending" />
          <p-button label="Envoyer" size="small" [disabled]="forgotForm.invalid || pending" type="submit" />
        </div>
      </div>

      <div>
        @for (message of messages; track message) {
          <p-message severity="error" [closable]="false">{{ message }}</p-message>
        }
      </div>
    </form>
  </div>
</section>
