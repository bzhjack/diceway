<section class="auth-mat-page">
  <mat-card class="auth-mat-card" appearance="outlined">
    <img mat-card-image ngSrc="assets/dw1.jpg" alt="" width="400" height="265" priority />

    <mat-card-header>
      <mat-card-title>Mot de passe oublié</mat-card-title>
      <mat-card-subtitle>Entrez votre adresse mail et nous vous enverrons un lien pour modifier votre mot de passe.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="auth-mat-form" (submit)="onSubmit($event)">
        <mat-form-field>
          <mat-label>Adresse mail</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput type="email" [formField]="forgotForm.email" autocomplete="username" />
          <mat-error>{{ forgotForm.email().errors()[0]?.message }}</mat-error>
        </mat-form-field>

        <dw-error-message [messages]="messages()" />

        <div class="auth-mat-actions auth-mat-actions--end">
          <button mat-stroked-button type="button" routerLink="/login" [disabled]="pending()">Retour</button>
          <button mat-flat-button type="submit" [disabled]="pending() || forgotForm().invalid()">
            @if (pending()) {
              <mat-progress-spinner mode="indeterminate" diameter="18" />
            } @else {
              Envoyer
            }
          </button>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <span class="auth-mat-footer">
        Vous vous souvenez de votre mot de passe ? <a routerLink="/login">Se connecter</a>
      </span>
    </mat-card-actions>
  </mat-card>
</section>
