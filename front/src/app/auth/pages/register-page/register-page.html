<section class="auth-mat-page">
  <mat-card class="auth-mat-card" appearance="outlined">
    <img mat-card-image ngSrc="assets/dw1.jpg" alt="" width="400" height="265" priority />

    <mat-card-header>
      <mat-card-title>Nouveau compte</mat-card-title>
      <mat-card-subtitle>Créez votre compte pour rejoindre l'aventure</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="registerForm" class="auth-mat-form" (ngSubmit)="register()">
        <mat-form-field>
          <mat-label>Pseudonyme</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="name" autocomplete="nickname" />
          <mat-error>Minimum 5 caractères</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Adresse mail</mat-label>
          <mat-icon matPrefix>mail</mat-icon>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          <mat-error>Adresse mail non valide</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Mot de passe</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-error>Minimum 8 caractères</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Confirmer le mot de passe</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput type="password" formControlName="password_confirmation" autocomplete="new-password" />
          <mat-error>Les mots de passe ne correspondent pas</mat-error>
        </mat-form-field>

        <dw-error-message [messages]="messages" />

        <div class="auth-mat-actions auth-mat-actions--end">
          <button mat-stroked-button type="button" routerLink="/login" [disabled]="pending">Retour</button>
          <button mat-flat-button type="submit" [disabled]="pending || registerForm.invalid">
            @if (pending) {
              <mat-progress-spinner mode="indeterminate" diameter="18" />
            } @else {
              Créer le compte
            }
          </button>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <span class="auth-mat-footer">
        Déjà un compte ? <a routerLink="/login">Se connecter</a>
      </span>
    </mat-card-actions>
  </mat-card>
</section>
