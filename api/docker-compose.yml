version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: diceway_app
    ports:
      - "8000:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - APP_ENV=local
      - APP_DEBUG=1
      - APP_URL=http://localhost:8000
      - PHP_MEMORY_LIMIT=512M
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    command: >
      sh -lc "composer install --prefer-dist --no-interaction &&
              php artisan key:generate --force &&
              php artisan migrate --force &&
              apache2-foreground"

  node:
    image: node:20-alpine
    container_name: diceway_node
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: sh -lc "npm ci || npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: diceway_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-diceway}
      - MYSQL_USER=${DB_USERNAME:-sail}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - dbdata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  dbdata:
